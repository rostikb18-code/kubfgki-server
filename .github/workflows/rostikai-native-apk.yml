name: RostikAI Native APK (no ZIP parts)

on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/**"
      - ".github/workflows/rostikai-native-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate native Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-native/settings.gradle.kts
          test -f android-native/build.gradle.kts
          test -f android-native/app/build.gradle.kts
          test -f android-native/app/src/main/AndroidManifest.xml
          test -f android-native/app/src/main/java/com/rostik/ai/MainActivity.kt
          grep -q 'applicationId = "com.rostik.ai"' android-native/app/build.gradle.kts
          grep -q 'class MainActivity' android-native/app/src/main/java/com/rostik/ai/MainActivity.kt
          echo "Native project preflight passed."

      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK" | tee android-native/app/build/outputs/apk/debug/SHA256.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-native-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 14
