name: RostikAI — model manifest consistency

on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/app/src/main/assets/models/MODEL_MANIFEST.json"
      - ".github/workflows/audit-onnx-models.yml"
  pull_request:
    paths:
      - "android-native/app/src/main/assets/models/MODEL_MANIFEST.json"
      - ".github/workflows/audit-onnx-models.yml"

permissions:
  contents: read

jobs:
  validate-model-manifest:
    name: Validate declared AI readiness honestly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check model manifest consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android-native/app/src/main/assets/models/MODEL_MANIFEST.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          models = data.get("models", [])
          detector = next((m for m in models if m.get("id") == "brawler_detector"), None)
          policy = next((m for m in models if m.get("id") == "action_policy"), None)
          assert detector is not None, "Manifest must explicitly declare the brawler detector"
          assert detector.get("status") == "generated_during_android_ci_from_pinned_source_checkpoint", "Unexpected detector readiness status"
          assert detector.get("source_commit") == "a5a797b28f1aa662db8364515bfd8342e66557a6", "Detector source must remain pinned"
          assert detector.get("license", "").startswith("AGPL-3.0"), "Model license must be disclosed"
          assert policy is not None and policy.get("status") == "missing", "Do not claim an action policy is integrated"
          assert data.get("status") == "partial_perception_pipeline_build_generated"
          print("PASS: manifest describes one build-generated detector and clearly marks the action policy missing.")
          print("The Android build workflow is authoritative for model export, CPU inference smoke test, APK contents, and compilation.")
          PY

      - name: Explain validation scope
        if: always()
        run: |
          echo "This workflow checks the manifest only."
          echo "The Android APK workflow separately exports the pinned detector, runs a CPU inference smoke test, compiles the APK, and checks the packaged model/runtime/license files."
          echo "Neither test proves live-game detection accuracy or autonomous gameplay."
