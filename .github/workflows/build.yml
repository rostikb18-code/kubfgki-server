name: Build Rostik Touch Bot v30.14

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rostik-touch-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build Android project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify repository is the Android project root
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          test -d app/src/main/assets
          test ! -d v30src
          test ! -d source
          echo "Android project root is correct."

      - name: Verify Gradle module wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'include\([[:space:]]*":app"[[:space:]]*\)' settings.gradle.kts
          grep -Eq 'com\.android\.application' build.gradle.kts
          grep -Eq 'com\.android\.application' app/build.gradle.kts
          grep -Eq 'org\.jetbrains\.kotlin\.android' app/build.gradle.kts
          echo "Gradle root -> :app wiring is present."

      - name: Verify source and asset references
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/brawler_icons_manifest.txt
          ICON_COUNT=$(find app/src/main/assets/brawler_icons -maxdepth 1 -type f -name '*.png' | wc -l)
          test "$ICON_COUNT" -eq 108
          MANIFEST_COUNT=$(wc -l < app/src/main/assets/brawler_icons_manifest.txt)
          test "$MANIFEST_COUNT" -eq 108
          while IFS= read -r id; do
            test -n "$id"
            test -f "app/src/main/assets/brawler_icons/${id}.png"
          done < app/src/main/assets/brawler_icons_manifest.txt
          test -f app/src/main/assets/reference/brawl_ball_lobby.png
          echo "Brawler assets: $ICON_COUNT/108"
          echo "Reference assets: OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Show versions
        shell: bash
        run: |
          java -version
          gradle --version
          echo "Project files:"
          find . -maxdepth 2 -type f | sort | head -120

      - name: Gradle configuration check
        run: gradle tasks --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK contains all 108 brawler icons
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"

          verify_apk() {
            local apk="$1"
            local count
            count=$(unzip -Z1 "$apk" | grep -E '^assets/brawler_icons/[^/]+\.png$' | wc -l)
            echo "$apk -> $count/108 brawler icons"
            test "$count" -eq 108
            while IFS= read -r id; do
              unzip -Z1 "$apk" | grep -Fxq "assets/brawler_icons/${id}.png"
            done < app/src/main/assets/brawler_icons_manifest.txt
          }

          verify_apk "$DEBUG_APK"
          verify_apk "$RELEASE_APK"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v30.14-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
