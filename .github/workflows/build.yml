name: Build Rostik Touch Bot v30.2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate v30.2 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for p in \
            RostikTouchBot-v30.2-FINAL-source.zip \
            source/RostikTouchBot-v30.2-FINAL-source.zip \
            ./RostikTouchBot-v30.2-FINAL-source.zip; do
            if [ -f "$p" ]; then ZIP="$p"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "Put RostikTouchBot-v30.2-FINAL-source.zip in the repository root (or source/)."
            exit 1
          fi
          rm -rf v30src
          unzip -q "$ZIP" -d .
          test -f v30src/settings.gradle.kts
          test -f v30src/app/src/main/AndroidManifest.xml
          test -f v30src/app/src/main/assets/reference/brawl_ball_lobby.png
          echo "SOURCE=$ZIP"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug and release
        working-directory: v30src
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f v30src/app/build/outputs/apk/debug/app-debug.apk
          test -f v30src/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh v30src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh v30src/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v30.2-APKs
          path: |
            v30src/app/build/outputs/apk/debug/app-debug.apk
            v30src/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
