```yaml
name: RostikAI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: rostikai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RostikAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v6

      - name: "2. Setup JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "3. Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "4. Install Android SDK 35"
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK: PASS"

      - name: "5. Check repository"
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

          find . -maxdepth 2 -type f | sort | head -300

      - name: "6. Locate RostikAI project parts"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .rostik_parts
          mkdir -p .rostik_assembled

          mapfile -t MERGED < <(
            find . -maxdepth 1 -type f \
              -name 'RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-*.zip' \
              -printf '%f\n' | sort
          )

          mapfile -t PYTHON < <(
            find . -maxdepth 1 -type f \
              -name 'RostikAI-v31.1.3-PYTHON-PORT-3-PART-*.zip' \
              -printf '%f\n' | sort
          )

          if [ "${#MERGED[@]}" -gt 0 ]; then
            echo "Using MERGED Android project parts:"
            printf '  %s\n' "${MERGED[@]}"
            printf '%s\n' "${MERGED[@]}" > .rostik_parts/list.txt

          elif [ "${#PYTHON[@]}" -gt 0 ]; then
            echo "Using PYTHON-PORT-3 project parts:"
            printf '  %s\n' "${PYTHON[@]}"
            printf '%s\n' "${PYTHON[@]}" > .rostik_parts/list.txt

          else
            echo "::error::RostikAI project ZIP parts were not found."
            exit 1
          fi

      - name: "7. Assemble project"
        shell: bash
        run: |
          set -euo pipefail

          rm -f .rostik_assembled/project.zip

          if compgen -G "RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-*.zip" > /dev/null; then
            mapfile -t PARTS < <(
              find . -maxdepth 1 -type f \
                -name 'RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-*.zip' \
                -printf '%f\n' | sort
            )
          else
            mapfile -t PARTS < <(
              find . -maxdepth 1 -type f \
                -name 'RostikAI-v31.1.3-PYTHON-PORT-3-PART-*.zip' \
                -printf '%f\n' | sort
            )
          fi

          for part in "${PARTS[@]}"; do
            echo "Adding: $part"
            cat "$part" >> .rostik_assembled/project.zip
          done

          echo "Testing assembled archive..."

          if unzip -t .rostik_assembled/project.zip >/tmp/zip-test.txt 2>&1; then
            echo "Concatenated ZIP: PASS"
          else
            echo "Concatenated archive is not a split ZIP."
            echo "Trying individual-part extraction..."

            rm -rf .rostik_assembled/source
            mkdir -p .rostik_assembled/source

            for part in "${PARTS[@]}"; do
              echo "Extracting: $part"
              unzip -q "$part" -d .rostik_assembled/source || {
                echo "::error::Cannot extract $part"
                exit 1
              }
            done
          fi

          if [ ! -d .rostik_assembled/source ]; then
            mkdir -p .rostik_assembled/source
            unzip -q .rostik_assembled/project.zip \
              -d .rostik_assembled/source
          fi

          echo "Project extracted successfully."

      - name: "8. Find Android project root"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find .rostik_assembled/source \
            -type f \
            -name 'settings.gradle.kts' \
            -printf '%h\n' | head -1 || true)"

          if [ -z "$ROOT" ]; then
            ROOT="$(find .rostik_assembled/source \
              -type f \
              -name 'settings.gradle' \
              -printf '%h\n' | head -1 || true)"
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle(.kts) was not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ROOT"

      - name: "9. Verify Android project structure"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ ! -f settings.gradle.kts ] &&
             [ ! -f settings.gradle ]; then
            echo "::error::settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f build.gradle.kts ] &&
             [ ! -f build.gradle ]; then
            echo "::error::root Gradle build file missing."
            exit 1
          fi

          test -f gradle.properties || {
            echo "::error::gradle.properties missing."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml missing."
            exit 1
          }

          test -d app/src/main/java || {
            echo "::error::app/src/main/java missing."
            exit 1
          }

          test -d app/src/main/assets || {
            echo "::error::app/src/main/assets missing."
            exit 1
          }

          test -f app/build.gradle.kts ||
            test -f app/build.gradle || {
              echo "::error::app Gradle build file missing."
              exit 1
            }

          echo "Android structure: PASS"

      - name: "10. Check source and assets"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          KOTLIN_COUNT="$(
            find app/src/main \
              -type f \
              -name '*.kt' \
              | wc -l
          )"

          ASSET_COUNT="$(
            find app/src/main/assets \
              -type f \
              | wc -l
          )"

          ICON_COUNT="$(
            find app/src/main/assets \
              -type f \
              \( -path '*/brawler_icons/*' \
                 -o -path '*/brawlers/*' \) \
              | wc -l
          )"

          echo "Kotlin files: $KOTLIN_COUNT"
          echo "Assets: $ASSET_COUNT"
          echo "Brawler/icon assets: $ICON_COUNT"

          if [ "$KOTLIN_COUNT" -lt 1 ]; then
            echo "::error::No Kotlin source files."
            exit 1
          fi

          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "::error::No Android assets."
            exit 1
          fi

          echo "Source/assets: PASS"

      - name: "11. Repair ScreenCaptureService activeReader"
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt"

          if [ ! -f "$FILE" ]; then
            FILE="$(
              find "$PROJECT_ROOT/app/src/main/java" \
                -type f \
                -name 'ScreenCaptureService.kt' \
                | head -1
            )"
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "::error::ScreenCaptureService.kt not found."
            exit 1
          fi

          echo "Repairing:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines(True)

          declaration = re.compile(
              r'^\s*val\s+activeReader\s*:\s*ImageReader\b'
          )

          function_pattern = re.compile(
              r'\bfun\s+[A-Za-z_][A-Za-z0-9_]*\s*\('
          )

          remove = set()

          i = 0

          while i < len(lines):

              if function_pattern.search(lines[i]):

                  start = i
                  depth = 0
                  opened = False
                  declarations = []

                  j = i

                  while j < len(lines):

                      line = lines[j]

                      depth += line.count("{")
                      depth -= line.count("}")

                      if "{" in line:
                          opened = True

                      if declaration.match(line):
                          declarations.append(j)

                      if opened and depth <= 0:

                          if len(declarations) > 1:
                              for duplicate in declarations[1:]:
                                  remove.add(duplicate)

                          i = j
                          break

                      j += 1

              i += 1

          if remove:
              path.write_text(
                  "".join(
                      line
                      for index, line in enumerate(lines)
                      if index not in remove
                  ),
                  encoding="utf-8"
              )

              print(
                  f"Removed {len(remove)} duplicate "
                  "activeReader declaration(s)."
              )
          else:
              print(
                  "No duplicate activeReader declaration "
                  "detected."
              )
          PY

          echo "Remaining declarations:"
          grep -nE \
            '^[[:space:]]*val[[:space:]]+activeReader[[:space:]]*:[[:space:]]*ImageReader\b' \
            "$FILE" || true

      - name: "12. Verify activeReader repair"
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          declaration = re.compile(
              r'^\s*val\s+activeReader\s*:\s*ImageReader\b'
          )

          function_pattern = re.compile(
              r'\bfun\s+[A-Za-z_][A-Za-z0-9_]*\s*\('
          )

          i = 0

          while i < len(lines):

              if function_pattern.search(lines[i]):

                  depth = 0
                  opened = False
                  count = 0

                  j = i

                  while j < len(lines):

                      line = lines[j]

                      depth += line.count("{")
                      depth -= line.count("}")

                      if "{" in line:
                          opened = True

                      if declaration.match(line):
                          count += 1

                      if opened and depth <= 0:

                          if count > 1:
                              print(
                                  "ERROR: duplicate activeReader "
                                  f"in function near line {i + 1}"
                              )
                              sys.exit(1)

                          i = j
                          break

                      j += 1

              i += 1

          print("activeReader check: PASS")
          PY

      - name: "13. Prepare Gradle wrapper"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f gradlew || {
            echo "::error::gradlew is missing."
            exit 1
          }

          chmod +x gradlew

          ./gradlew --version

      - name: "14. Clean project"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

      - name: "15. Compile Kotlin"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace

      - name: "16. Build Debug APK"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: "17. Verify APK"
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::app-debug.apk was not created."

            find "$PROJECT_ROOT/app/build/outputs" \
              -type f 2>/dev/null \
              | sort || true

            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"

          if [ "$SIZE" -le 10000 ]; then
            echo "::error::APK is suspiciously small."
            exit 1
          fi

          echo "APK: $APK"
          echo "Size: $SIZE bytes"
          echo "SHA256: $SHA"
          echo "APK verification: PASS"

      - name: "18. Upload APK"
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-v31.1.3-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: "19. Upload build reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-build-reports
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/reports/**
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
```
