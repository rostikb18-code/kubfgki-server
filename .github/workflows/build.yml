name: Build Rostik Touch Bot v30.14

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rostik-touch-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.10.2'
  ANDROID_PLATFORM: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Auto-extract, discover, verify and build Android project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repository is allowed to contain ONLY the workflow + project ZIP.
      # If a real Android project is not already present, this step finds the
      # best RostikTouchBot ZIP and extracts it automatically.
      - name: Prepare Android project from repository or ZIP
        shell: bash
        run: |
          set -euo pipefail

          REPO_ROOT="$GITHUB_WORKSPACE"
          cd "$REPO_ROOT"

          has_project() {
            local d="$1"
            [[ -f "$d/settings.gradle.kts" || -f "$d/settings.gradle" ]] || return 1
            [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]] || return 1
            [[ -f "$d/app/src/main/AndroidManifest.xml" ]] || return 1
            return 0
          }

          if has_project "$REPO_ROOT" || has_project "$REPO_ROOT/source" || has_project "$REPO_ROOT/v30src"; then
            echo "An Android project is already present; no ZIP extraction required."
            exit 0
          fi

          mkdir -p "$REPO_ROOT/.ci/extracted"

          BEST_ZIP=""
          BEST_SCORE=-1

          while IFS= read -r -d '' zip; do
            echo "Inspecting ZIP: $zip"
            score=0

            # A valid project ZIP must contain the three core files somewhere.
            unzip -Z1 "$zip" > "$REPO_ROOT/.ci/zip-list.txt"

            grep -Eq '(^|/)settings\.gradle(\.kts)?$' "$REPO_ROOT/.ci/zip-list.txt" && score=$((score+20))
            grep -Eq '(^|/)app/build\.gradle(\.kts)?$' "$REPO_ROOT/.ci/zip-list.txt" && score=$((score+20))
            grep -Eq '(^|/)app/src/main/AndroidManifest\.xml$' "$REPO_ROOT/.ci/zip-list.txt" && score=$((score+20))
            grep -Eq '(^|/)app/src/main/assets/brawler_icons_manifest\.txt$' "$REPO_ROOT/.ci/zip-list.txt" && score=$((score+20))

            icon_count="$(grep -Ec '^(.*/)?app/src/main/assets/brawler_icons/[^/]+\.png$' "$REPO_ROOT/.ci/zip-list.txt" || true)"
            [[ "$icon_count" -eq 108 ]] && score=$((score+100))

            # Prefer RostikTouchBot project archives if several ZIPs exist.
            case "$(basename "$zip")" in
              *RostikTouchBot*|*rostik*|*ROSTIK*) score=$((score+10)) ;;
            esac

            echo "  score=$score icons=$icon_count"

            if (( score > BEST_SCORE )); then
              BEST_ZIP="$zip"
              BEST_SCORE="$score"
            fi
          done < <(find "$REPO_ROOT" -maxdepth 3 -type f -iname '*.zip' -print0 | sort -z)

          if [[ -z "$BEST_ZIP" || "$BEST_SCORE" -lt 60 ]]; then
            echo "ERROR: No usable Android project or project ZIP was found."
            echo
            echo "Expected either an Android project containing:"
            echo "  settings.gradle(.kts)"
            echo "  app/build.gradle(.kts)"
            echo "  app/src/main/AndroidManifest.xml"
            echo
            echo "or a ZIP containing those files."
            echo
            echo "Repository files:"
            find "$REPO_ROOT" -maxdepth 5 -type f \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/.ci/*' \
              | sort | head -300
            exit 1
          fi

          echo "Selected project ZIP: $BEST_ZIP"
          echo "ZIP score: $BEST_SCORE"

          rm -rf "$REPO_ROOT/.ci/extracted/project"
          mkdir -p "$REPO_ROOT/.ci/extracted/project"
          unzip -q "$BEST_ZIP" -d "$REPO_ROOT/.ci/extracted/project"

          echo "ZIP extracted successfully."
          find "$REPO_ROOT/.ci/extracted/project" -maxdepth 5 -type f \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | sort | head -150

      - name: Discover Android project root
        shell: bash
        run: |
          set -euo pipefail

          REPO_ROOT="$GITHUB_WORKSPACE"
          cd "$REPO_ROOT"

          declare -a CANDIDATES=()

          add_candidate() {
            local d="$1"
            [[ -d "$d" ]] || return 0
            [[ -f "$d/settings.gradle.kts" || -f "$d/settings.gradle" ]] || return 0
            [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]] || return 0
            [[ -f "$d/app/src/main/AndroidManifest.xml" ]] || return 0

            local existing
            for existing in "${CANDIDATES[@]:-}"; do
              [[ "$existing" == "$d" ]] && return 0
            done
            CANDIDATES+=("$d")
          }

          add_candidate "$REPO_ROOT"
          add_candidate "$REPO_ROOT/source"
          add_candidate "$REPO_ROOT/v30src"

          while IFS= read -r -d '' settings_file; do
            add_candidate "$(dirname "$settings_file")"
          done < <(
            find "$REPO_ROOT" \
              -type d \( \
                -name .git -o \
                -name .gradle -o \
                -name build -o \
                -name node_modules \
              \) -prune -false \
              -o -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print0
          )

          if (( ${#CANDIDATES[@]} == 0 )); then
            echo "ERROR: ZIP was extracted, but no Android Gradle project was found inside it."
            echo "The archive must contain settings.gradle(.kts), app/build.gradle(.kts), and app/src/main/AndroidManifest.xml."
            exit 1
          fi

          score_candidate() {
            local d="$1"
            local score=0
            local icon_count=0
            local manifest_count=0

            [[ -f "$d/settings.gradle.kts" ]] && score=$((score+3))
            [[ -f "$d/settings.gradle" ]] && score=$((score+2))
            [[ -f "$d/build.gradle.kts" ]] && score=$((score+2))
            [[ -f "$d/build.gradle" ]] && score=$((score+2))
            [[ -f "$d/gradle.properties" ]] && score=$((score+1))
            [[ -d "$d/gradle" ]] && score=$((score+1))
            [[ -d "$d/app/src/main/kotlin" ]] && score=$((score+3))
            [[ -d "$d/app/src/main/java" ]] && score=$((score+3))
            [[ -d "$d/app/src/main/assets" ]] && score=$((score+5))
            [[ -d "$d/app/src/main/assets/brawler_icons" ]] && score=$((score+8))
            [[ -f "$d/app/src/main/assets/brawler_icons_manifest.txt" ]] && score=$((score+8))
            [[ -f "$d/app/src/main/assets/reference/brawl_ball_lobby.png" ]] && score=$((score+3))

            if [[ -d "$d/app/src/main/assets/brawler_icons" ]]; then
              icon_count="$(find "$d/app/src/main/assets/brawler_icons" -maxdepth 1 -type f -name '*.png' | wc -l)"
              [[ "$icon_count" -eq 108 ]] && score=$((score+30))
            fi

            if [[ -f "$d/app/src/main/assets/brawler_icons_manifest.txt" ]]; then
              manifest_count="$(grep -cve '^[[:space:]]*$' "$d/app/src/main/assets/brawler_icons_manifest.txt" || true)"
              [[ "$manifest_count" -eq 108 ]] && score=$((score+20))
            fi

            printf '%s' "$score"
          }

          BEST=""
          BEST_SCORE=-1

          echo "Discovered Android candidates:"
          for d in "${CANDIDATES[@]}"; do
            score="$(score_candidate "$d")"
            printf '  score=%-3s %s\n' "$score" "$d"

            if (( score > BEST_SCORE )); then
              BEST="$d"
              BEST_SCORE="$score"
            elif (( score == BEST_SCORE )); then
              best_len=${#BEST}
              d_len=${#d}
              if (( d_len < best_len )) || { (( d_len == best_len )) && [[ "$d" < "$BEST" ]]; }; then
                BEST="$d"
              fi
            fi
          done

          PROJECT_ROOT="$BEST"
          PROJECT_ROOT_REL="${PROJECT_ROOT#"$REPO_ROOT"/}"
          [[ "$PROJECT_ROOT" == "$REPO_ROOT" ]] && PROJECT_ROOT_REL="."

          echo
          echo "Repository root : $REPO_ROOT"
          echo "Android root    : $PROJECT_ROOT"
          echo "Relative root   : $PROJECT_ROOT_REL"
          echo "Score           : $BEST_SCORE"

          {
            echo "PROJECT_ROOT=$PROJECT_ROOT"
            echo "PROJECT_ROOT_REL=$PROJECT_ROOT_REL"
          } >> "$GITHUB_ENV"

      - name: Verify discovered Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/kotlin || test -d app/src/main/java
          test -d app/src/main/assets
          test -d app/src/main/assets/brawler_icons

          echo "Android project root: $PROJECT_ROOT"

      - name: Verify Gradle module wiring
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          SETTINGS="settings.gradle.kts"
          [[ -f "$SETTINGS" ]] || SETTINGS="settings.gradle"
          APP_BUILD="app/build.gradle.kts"
          [[ -f "$APP_BUILD" ]] || APP_BUILD="app/build.gradle"

          grep -Eq 'include[[:space:]]*\([[:space:]]*["'"']?:app["'"']?[[:space:]]*\)' "$SETTINGS"
          grep -Eq 'com\.android\.application' "$APP_BUILD"
          grep -Eq 'org\.jetbrains\.kotlin\.android|org\.jetbrains\.kotlin\.jvm' "$APP_BUILD" || {
            echo "ERROR: Kotlin plugin was not found in $APP_BUILD"
            exit 1
          }

      - name: Verify 108 brawler assets and references
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          ASSETS="app/src/main/assets"
          ICONS="$ASSETS/brawler_icons"
          MANIFEST="$ASSETS/brawler_icons_manifest.txt"

          test -f "$MANIFEST"
          test -d "$ICONS"

          ICON_COUNT="$(find "$ICONS" -maxdepth 1 -type f -name '*.png' | wc -l)"
          MANIFEST_COUNT="$(grep -cve '^[[:space:]]*$' "$MANIFEST" || true)"

          echo "PNG icons      : $ICON_COUNT"
          echo "Manifest items : $MANIFEST_COUNT"

          test "$ICON_COUNT" -eq 108
          test "$MANIFEST_COUNT" -eq 108

          declare -A SEEN=()
          while IFS= read -r raw_id; do
            id="$(printf '%s' "$raw_id" | tr -d '\r' | xargs)"
            [[ -n "$id" ]] || continue
            [[ "$id" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid brawler id: $id"; exit 1; }
            [[ -z "${SEEN[$id]+x}" ]] || { echo "Duplicate brawler id: $id"; exit 1; }
            SEEN[$id]=1
            test -f "$ICONS/${id}.png" || { echo "Missing icon: ${id}.png"; exit 1; }
          done < "$MANIFEST"

          while IFS= read -r -d '' png; do
            id="$(basename "$png" .png)"
            [[ -n "${SEEN[$id]+x}" ]] || { echo "PNG not listed in manifest: $id.png"; exit 1; }
          done < <(find "$ICONS" -maxdepth 1 -type f -name '*.png' -print0)

          test -f "$ASSETS/reference/brawl_ball_lobby.png"
          echo "108 brawlers + manifest + Brawl Ball reference: OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle sees :app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle -q projects --no-daemon
          gradle -q projects --no-daemon | grep -Fq "Project ':app'"

      - name: Gradle configuration check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle tasks --stacktrace --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK contains all 108 brawler icons
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"

          verify_apk() {
            local apk="$1"
            local count
            count="$(unzip -Z1 "$apk" | grep -E '^assets/brawler_icons/[^/]+\.png$' | wc -l)"
            echo "$apk -> $count/108 brawler icons"
            test "$count" -eq 108

            while IFS= read -r raw_id; do
              id="$(printf '%s' "$raw_id" | tr -d '\r' | xargs)"
              [[ -n "$id" ]] || continue
              unzip -Z1 "$apk" | grep -Fxq "assets/brawler_icons/${id}.png"
            done < app/src/main/assets/brawler_icons_manifest.txt
          }

          verify_apk "$DEBUG_APK"
          verify_apk "$RELEASE_APK"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v30.14-apks
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
