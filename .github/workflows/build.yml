name: RostikAI Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android-native/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate native project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-native/settings.gradle.kts
          test -f android-native/build.gradle.kts
          test -f android-native/gradle.properties
          test -f android-native/app/build.gradle.kts
          test -f android-native/app/src/main/AndroidManifest.xml
          test -f android-native/app/src/main/java/com/rostik/ai/MainActivity.kt
          test -f android-native/app/src/main/java/com/rostik/ai/OverlayService.kt
          grep -q 'android:name=".OverlayService"' android-native/app/src/main/AndroidManifest.xml
          grep -q 'ACTION_START' android-native/app/src/main/java/com/rostik/ai/OverlayService.kt
          grep -q 'applicationId = "com.rostik.ai"' android-native/app/build.gradle.kts
          grep -q 'class MainActivity' android-native/app/src/main/java/com/rostik/ai/MainActivity.kt
          grep -q 'onnxruntime-android' android-native/app/build.gradle.kts
          echo "Native project preflight passed."

      - name: Audit AI asset readiness (non-blocking, honest report)
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="android-native/app/src/main/assets/brawler_icons"
          MODEL_DIR="android-native/app/src/main/assets/models"
          if [ -d "$ICON_DIR" ]; then
            ICON_COUNT=$(find "$ICON_DIR" -type f \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' \) | wc -l)
          else
            ICON_COUNT=0
          fi
          if [ -d "$MODEL_DIR" ]; then
            MODEL_COUNT=$(find "$MODEL_DIR" -type f -iname '*.onnx' | wc -l)
          else
            MODEL_COUNT=0
          fi
          echo "Brawler icon files found: $ICON_COUNT (target: 108)"
          echo "ONNX files found: $MODEL_COUNT (target: 5)"
          if [ "$ICON_COUNT" -ne 108 ]; then echo "::warning::Expected 108 real brawler icons; found $ICON_COUNT."; fi
          if [ "$MODEL_COUNT" -ne 5 ]; then echo "::warning::Expected 5 ONNX files; found $MODEL_COUNT."; fi
          if [ "$MODEL_COUNT" -eq 5 ]; then
            for model in "$MODEL_DIR"/*.onnx; do
              test -s "$model" || { echo "::error::Empty ONNX file: $model"; exit 1; }
              file "$model"
            done
          fi
          echo "Asset counts alone do not verify model validity, provenance, tensor compatibility, or inference quality."

      - name: Build debug APK
        working-directory: android-native
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace --console=plain assembleDebug 2>&1 | tee build.log

      - name: Verify APK package and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.rostik.ai'"
          echo "APK package id verified: com.rostik.ai"
          echo "APK CREATED:"
          ls -lh "$APK"
          sha256sum "$APK" | tee android-native/app/build/outputs/apk/debug/SHA256.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-native-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-build-logs
          path: |
            android-native/build.log
            android-native/app/build/reports/**
            android-native/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
