name: Build Rostik Touch Bot v29 FIXED

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate complete v29 project from this ONE file
        env:
          PROJECT_B64: |
            {"README.md":"","app/build.gradle.kts":"","app/proguard-rules.pro":"IyBSb3N0aWsgVG91Y2ggQm90IDI5LjAK","app/src/main/AndroidManifest.xml":"","app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt":"","app/src/main/java/com/rostik/touchbot/CupReader.kt":"","app/src/main/java/com/rostik/touchbot/CupTracker.kt":"","app/src/main/java/com/rostik/touchbot/MainActivity.kt":"","app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt":"","app/src/main/java/com/rostik/touchbot/MatchVision.kt":"","app/src/main/java/com/rostik/touchbot/Models.kt":"","app/src/main/java/com/rostik/touchbot/OcrEngine.kt":"","app/src/main/java/com/rostik/touchbot/QueueEngine.kt":"","app/src/main/java/com/rostik/touchbot/ReactiveBrawlBallController.kt":"","app/src/main/java/com/rostik/touchbot/RewardHandler.kt":"","app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt":"","app/src/main/res/values/strings.xml":"PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlJvc3RpayBUb3VjaCBCb3Q8L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==","app/src/main/res/values/styles.xml":"","app/src/main/res/xml/accessibility_service_config.xml":"","build.gradle.kts":"cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4xLjAiIGFwcGx5IGZhbHNlCn0K","gradle/wrapper/gradle-wrapper.properties":"ZGlzdHJpYnV0aW9uQmFzZT1HUkFETEVfVVNFUl9IT01FCmRpc3RyaWJ1dGlvblBhdGg9d3JhcHBlci9kaXN0cwpuZXR3b3JrVGltZW91dD0xMDAwMAp2YWxpZGF0ZURpc3RyaWJ1dGlvblVybD10cnVlCmRpc3RyaWJ1dGlvblVybD1odHRwc1w6Ly9zZXJ2aWNlcy5ncmFkbGUub3JnL2Rpc3RyaWJ1dGlvbnMvZ3JhZGxlLTguMTAuMi1iaW4uemlwCg==","gradle.properties":"b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==","settings.gradle.kts":""}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path

          payload = json.loads(os.environ["PROJECT_B64"])
          for name, data in payload.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(data))
          PY

      - name: Verify critical Android configuration
        shell: bash
        run: |
          grep -q 'android:canPerformGestures="true"' app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'ContextCompat.startForegroundService' app/src/main/java/com/rostik/touchbot/MainActivity.kt
          grep -q 'POST_NOTIFICATIONS' app/src/main/java/com/rostik/touchbot/MainActivity.kt
          grep -q 'FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION' app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v29-debug-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
