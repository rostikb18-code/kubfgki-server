f"archive path uniqueness OK: {len(seen)} files") PY for n in 01 02 03 04; do unzip -q \ "${PART_DIR}/${PYTHON_PREFIX}${n}.zip" \ -d .rostik_assembled done rm -rf app gradle rm -f \ settings.gradle.kts \ build.gradle.kts \ gradle.properties \ gradlew \ gradlew.bat \ ROSTIK_SOURCE_ID.txt \ VERIFICATION_REPORT.md \ tools/verify_source.py cp -a .rostik_assembled/. ./ test -f settings.gradle.kts test -f build.gradle.kts test -f app/build.gradle.kts test -f app/src/main/AndroidManifest.xml test -f ROSTIK_SOURCE_ID.txt test -f tools/verify_source.py test -f .github/workflows/build.yml elif [[ "$python_count" -ne 0 ]]; then echo "ERROR: incomplete PYTHON-PORT-3 ZIP source set." echo "Found $python_count/4 parts." exit 1 elif [[ -f ROSTIK_SOURCE_ID.txt && -f settings.gradle.kts && -f app/build.gradle.kts ]]; then echo "No source ZIP parts found; using repository source directly." else echo "ERROR: Android source is missing and no complete PYTHON-PORT-3 four-part source set was found." exit 1 fi echo "Source identity:" cat ROSTIK_SOURCE_ID.txt grep -qx \ 'ROSTIKAI-31.1.3-PYTHON-PORT-3' \ ROSTIK_SOURCE_ID.txt echo "Source assembly/identity check passed." - name: "Discord - build started" continue-on-error: true shell: bash run: | if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification." exit 0 fi set -euo pipefail payload=$(python3 - <<'PY2' import json import os print(json.dumps({ "username": "RostikAI CI", "allowed_mentions": { "parse": [] }, "embeds": [{ "title": "[BUILD] GitHub Actions started", "description": "RostikAI v31.1.3 build started.", "color": 3447003, "fields": [ { "name": "branch", "value": os.environ.get("GITHUB_REF_NAME", "-"), "inline": True }, { "name": "commit", "value": os.environ.get("GITHUB_SHA", "-")[:12], "inline": True }, { "name": "run", "value": os.environ.get("GITHUB_RUN_ID", "-"), "inline": True } ] }] })) PY2 ) curl -fsS \ -X POST \ -H 'Content-Type: application/json' \ --data "$pa