name: RostikAI v31.1.3 - Build + Full Verification

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      ANDROID_PLATFORM: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_VERSION: "8.10.2"

    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v6

      # ============================================================
      # SOURCE ASSEMBLY
      # ============================================================

      - name: "2. Assemble and verify PYTHON-PORT-3 source"
        shell: bash
        run: |
          set -euo pipefail

          PART_DIR=".rostik_parts"
          ASSEMBLED_DIR=".rostik_assembled"

          rm -rf "$PART_DIR" "$ASSEMBLED_DIR"
          mkdir -p "$PART_DIR" "$ASSEMBLED_DIR"

          PREFIX="RostikAI-v31.1.3-PYTHON-PORT-3-PART-"

          declare -A SHA256=(
            [01]="a1f50b0dd5fba6b09d0ae47054ec766623865941f405ab03825422199f2b9863"
            [02]="f4599d66729057598ba5153ea5e7041e5a4c9002c950ec63f94677f0c2b13c95"
            [03]="7b7f03566c5df861d546351d7cd92b6a4ed35c952579b255395fd902d7d1e807"
            [04]="6098a6a033bf75734526977dadca04ec1a7ba4ece2974f61644fe7c167af9328"
          )

          for n in 01 02 03 04; do
            FILE="${PREFIX}${n}.zip"

            if [[ ! -f "$FILE" ]]; then
              echo "ERROR: missing $FILE"
              exit 1
            fi

            echo "=================================================="
            echo "VERIFYING $FILE"
            echo "=================================================="

            ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
            EXPECTED="${SHA256[$n]}"

            echo "expected=$EXPECTED"
            echo "actual=$ACTUAL"

            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "ERROR: SHA-256 mismatch: $FILE"
              exit 1
            fi

            unzip -tq "$FILE"

            cp -f "$FILE" "$PART_DIR/$FILE"

            echo "SHA-256 OK: $FILE"
            echo
          done

          python3 - "$PART_DIR" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1])
          seen = {}

          for archive in sorted(root.glob("*.zip")):
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if name.endswith("/"):
                          continue

                      if name in seen:
                          raise SystemExit(
                              f"duplicate file across parts: "
                              f"{name} ({seen[name]} and {archive.name})"
                          )

                      seen[name] = archive.name

          if ".github/workflows/build.yml" in seen:
              raise SystemExit(
                  "ERROR: build.yml must remain outside source parts"
              )

          print(f"archive uniqueness OK: {len(seen)} files")
          PY

          for n in 01 02 03 04; do
            unzip -q \
              "${PART_DIR}/${PREFIX}${n}.zip" \
              -d "$ASSEMBLED_DIR"
          done

          rm -rf app gradle

          rm -f \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            gradlew \
            gradlew.bat \
            ROSTIK_SOURCE_ID.txt \
            VERIFICATION_REPORT.md \
            tools/verify_source.py

          cp -a "$ASSEMBLED_DIR"/. ./

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f ROSTIK_SOURCE_ID.txt
          test -f tools/verify_source.py

          echo "SOURCE ID:"
          cat ROSTIK_SOURCE_ID.txt

          grep -qx \
            'ROSTIKAI-31.1.3-PYTHON-PORT-3' \
            ROSTIK_SOURCE_ID.txt

          echo "SOURCE ASSEMBLY PASS"

      # ============================================================
      # JAVA
      # ============================================================

      - name: "3. Set up Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: "4. Locate Android SDK"
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK" || {
            echo "ERROR: Android SDK not found"
            exit 1
          }

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(
            find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -path '*/bin/sdkmanager' \
              2>/dev/null |
              sort -V |
              tail -n 1
          )"

          test -n "$SDKMANAGER" || {
            echo "ERROR: sdkmanager not found"
            exit 1
          }

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: "5. Install Android SDK components"
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: "6. Set up Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # STATIC PREFLIGHT
      # ============================================================

      - name: "7. Source preflight"
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_source.py

      - name: "8. Verify Android project"
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/rostik/touchbot/MainActivity.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/TrophyObserver.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/TrophyRules.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/LegacyStateDetector.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/BrawlStarsApiClient.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/RuntimeMetrics.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/RuntimeLog.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/RecoveryEvents.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/PerformanceProfile.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/PerformanceAutoTuner.kt

          test -f \
            app/src/main/java/com/rostik/touchbot/PerfProfiler.kt

          echo "ANDROID PROJECT STRUCTURE PASS"

      # ============================================================
      # BRAWLERS
      # ============================================================

      - name: "9. Verify 108 brawlers"
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            grep -Ev '^[[:space:]]*$' \
              app/src/main/assets/brawler_icons_manifest.txt |
              wc -l |
              tr -d ' '
          )"

          test "$COUNT" = "108"

          grep -q 'e("shelly"' \
            app/src/main/java/com/rostik/touchbot/BrawlerCatalog.kt

          grep -q 'e("spike"' \
            app/src/main/java/com/rostik/touchbot/BrawlerCatalog.kt

          ICONS="$(
            find app/src/main/assets/brawler_icons \
              -type f \
              -name '*.png' |
              wc -l |
              tr -d ' '
          )"

          test "$ICONS" = "108"

          echo "108 BRAWLERS PASS"

      # ============================================================
      # MAPS / ASSETS
      # ============================================================

      - name: "10. Verify maps and assets"
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/assets/apk_port/maps/brawl_ball_maps.json

          test -f \
            app/src/main/assets/apk_port/lobby/victory.png

          test -f \
            app/src/main/assets/apk_port/lobby/defeat.png

          test -f \
            app/src/main/assets/apk_port/ui_objects/brawlball_gamemode_icon.png

          test -f \
            app/src/main/assets/brawler_avatar_map.properties

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/apk_port/maps/brawl_ball_maps.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data, dict)
          assert len(data) >= 80
          assert "Back Pocket" in data

          for name, grid in data.items():
              assert isinstance(grid, list)
              assert len(grid) == 33

              for row in grid:
                  assert isinstance(row, str)
                  assert len(row) == 21

          print("BRAWL BALL MAPS PASS:", len(data))
          PY

      # ============================================================
      # RUNTIME STRUCTURE
      # ============================================================

      - name: "11. Verify runtime integration"
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'Frame watchdog recovery' \
            app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt

          grep -q \
            'GestureResultCallback' \
            app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt

          grep -q \
            'gestureBusy' \
            app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt

          grep -q \
            'heartbeatMovement' \
            app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt

          grep -q \
            'object TrophyRules' \
            app/src/main/java/com/rostik/touchbot/TrophyRules.kt

          grep -q \
            'LegacyStateDetector(assets)' \
            app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt

          grep -q \
            'BrawlStarsApiClient(context)' \
            app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt

          echo "RUNTIME INTEGRATION PASS"

      # ============================================================
      # KNOWN BAD SYMBOLS
      # ============================================================

      - name: "12. Check known broken symbols"
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            -E \
            'FRAME_RATE_COMPATIBILITY_NO_VIOLATION|selectAllOnFocus[[:space:]]*=' \
            app/src/main/java; then

            echo "ERROR: known broken symbol found"
            exit 1
          fi

          if grep -RIn \
            --exclude-dir=build \
            --exclude='*.bin' \
            -E \
            'TODO|FIXME|NotImplementedException|UnsupportedOperationException' \
            app/src/main/java; then

            echo "ERROR: unfinished implementation marker found"
            exit 1
          fi

          echo "BROKEN SYMBOL SCAN PASS"

      # ============================================================
      # VERSION / BUILD CONFIG
      # ============================================================

      - name: "13. Verify build configuration"
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'versionCode = 54' \
            app/build.gradle.kts

          grep -q \
            'versionName = "31.1.3"' \
            app/build.gradle.kts

          grep -q \
            'buildConfig = true' \
            app/build.gradle.kts

          grep -q \
            'import com.rostik.touchbot.BuildConfig' \
            app/src/main/java/com/rostik/touchbot/DiscordLogger.kt

          grep -q \
            'override fun onBind(intent: Intent?): IBinder? = null' \
            app/src/main/java/com/rostik/touchbot/OverlayService.kt

          echo "BUILD CONFIG PASS"

      # ============================================================
      # TOOL VERSIONS
      # ============================================================

      - name: "14. Print build tool versions"
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          "$SDKMANAGER" --version

      # ============================================================
      # KOTLIN COMPILE
      # ============================================================

      - name: "15. Compile Debug Kotlin"
        id: compile_debug
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --console=plain \
            --stacktrace \
            :app:compileDebugKotlin \
            2>&1 | tee compileDebugKotlin.log

      - name: "16. Lint Debug"
        id: lint_debug
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --console=plain \
            --stacktrace \
            :app:lintDebug \
            2>&1 | tee lintDebug.log

      - name: "17. Compile Release Kotlin"
        id: compile_release
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --console=plain \
            --stacktrace \
            :app:compileReleaseKotlin \
            2>&1 | tee compileReleaseKotlin.log

      # ============================================================
      # APK
      # ============================================================

      - name: "18. Build Debug APK"
        id: build_debug
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --console=plain \
            --stacktrace \
            :app:assembleDebug \
            2>&1 | tee assembleDebug.log

      - name: "19. Verify Debug APK"
        id: verify_debug
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          unzip -Z1 "$APK" |
            grep -q '^assets/brawler_icons/shelly.png$'

          unzip -Z1 "$APK" |
            grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'

          unzip -Z1 "$APK" |
            grep -q '^assets/apk_port/models/m0.bin$'

          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk = sys.argv[1]

          names = set(
              zipfile.ZipFile(apk).namelist()
          )

          ids = [
              x.strip()
              for x in Path(
                  "app/src/main/assets/brawler_icons_manifest.txt"
              ).read_text().splitlines()
              if x.strip()
          ]

          assert len(ids) == 108

          missing = [
              f"assets/brawler_icons/{i}.png"
              for i in ids
              if f"assets/brawler_icons/{i}.png" not in names
          ]

          assert not missing, missing[:10]

          print("DEBUG APK: 108 BRAWLER ICONS PASS")
          PY

      - name: "20. Build Release APK"
        id: build_release
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --console=plain \
            --stacktrace \
            :app:assembleRelease \
            2>&1 | tee assembleRelease.log

      - name: "21. Verify Release APK"
        id: verify_release
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          unzip -Z1 "$APK" |
            grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'

          unzip -Z1 "$APK" |
            grep -q '^assets/apk_port/brawler_icons/shelly.png$'

          unzip -Z1 "$APK" |
            grep -q '^assets/apk_port/lobby/victory.png$'

          echo "RELEASE APK PASS"

      # ============================================================
      # ALWAYS UPLOAD LOGS
      # ============================================================

      - name: "22. Upload APKs and compiler logs"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-build-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            compileDebugKotlin.log
            compileReleaseKotlin.log
            lintDebug.log
            assembleDebug.log
            assembleRelease.log

      # ============================================================
      # SHOW REAL COMPILER ERROR
      # ============================================================

      - name: "23. Print diagnostics"
        if: ${{ failure() }}
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "DEBUG KOTLIN COMPILER"
          echo "=================================================="

          if [[ -f compileDebugKotlin.log ]]; then
            tail -300 compileDebugKotlin.log
          else
            echo "compileDebugKotlin.log not found"
          fi

          echo ""
          echo "=================================================="
          echo "RELEASE KOTLIN COMPILER"
          echo "=================================================="

          if [[ -f compileReleaseKotlin.log ]]; then
            tail -300 compileReleaseKotlin.log
          else
            echo "compileReleaseKotlin.log not found"
          fi

          echo ""
          echo "=================================================="
          echo "LINT"
          echo "=================================================="

          if [[ -f lintDebug.log ]]; then
            tail -300 lintDebug.log
          else
            echo "lintDebug.log not found"
          fi

      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: "24. Final status"
        if: ${{ always() }}
        shell: bash
        run: |
          echo "compile_debug=${{ steps.compile_debug.outcome }}"
          echo "lint_debug=${{ steps.lint_debug.outcome }}"
          echo "compile_release=${{ steps.compile_release.outcome }}"
          echo "build_debug=${{ steps.build_debug.outcome }}"
          echo "verify_debug=${{ steps.verify_debug.outcome }}"
          echo "build_release=${{ steps.build_release.outcome }}"
          echo "verify_release=${{ steps.verify_release.outcome }}"
