build:
name: "BUILD — compile + lint + APK"
needs: verify
runs-on: ubuntu-24.04
timeout-minutes: 35

```
steps:
  - name: "1. Checkout repository"
    uses: actions/checkout@v6

  - name: "2. Download source that passed CHECK"
    uses: actions/download-artifact@v8
    with:
      name: RostikAI-v31.1.3-verified-source
      path: /tmp/verified

  - name: "3. Restore verified source"
    shell: bash
    run: |
      set -euo pipefail

      test -f /tmp/verified/rostikai-verified-source.tar.gz

      tar -xzf /tmp/verified/rostikai-verified-source.tar.gz -C .

      test -f settings.gradle.kts
      test -f app/build.gradle.kts
      test -f ROSTIK_SOURCE_ID.txt

      grep -qx \
        'ROSTIKAI-31.1.3-PYTHON-PORT-3' \
        ROSTIK_SOURCE_ID.txt

      python3 tools/verify_source.py

      echo "VERIFIED_SOURCE_RESTORED"

  - name: "4. Set up Java 17"
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: "17"

  - name: "5. Locate Android SDK"
    shell: bash
    run: |
      set -euo pipefail

      SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

      test -n "$SDK" || {
        echo "ERROR: Android SDK not found"
        exit 1
      }

      echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      SDKMANAGER="$(
        find "$SDK/cmdline-tools" \
          -type f \
          -name sdkmanager \
          -path '*/bin/sdkmanager' \
          2>/dev/null |
        sort -V |
        tail -n 1 || true
      )"

      test -n "$SDKMANAGER" || {
        echo "ERROR: sdkmanager not found"
        exit 1
      }

      echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

  - name: "6. Install Android SDK 35"
    shell: bash
    run: |
      set -euo pipefail

      yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      "$SDKMANAGER" \
        "platform-tools" \
        "platforms;android-${ANDROID_PLATFORM}" \
        "build-tools;${ANDROID_BUILD_TOOLS}"

  - name: "7. Set up Gradle 8.10.2"
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: ${{ env.GRADLE_VERSION }}

  - name: "8. Prepare CI logs"
    shell: bash
    run: |
      set -euo pipefail

      rm -rf ci-logs
      mkdir -p ci-logs

      java -version 2>&1 |
        tee ci-logs/java-version.log

      gradle --version 2>&1 |
        tee ci-logs/gradle-version.log

  - id: compile_debug
    name: "9. Compile Debug Kotlin"
    shell: bash
    run: |
      set -o pipefail

      gradle \
        --no-daemon \
        --console=plain \
        --stacktrace \
        --warning-mode=all \
        :app:compileDebugKotlin \
        2>&1 |
        tee ci-logs/compileDebugKotlin.log

      status=${PIPESTATUS[0]}

      echo "exit=$status" |
        tee -a ci-logs/compileDebugKotlin.log

      exit "$status"

  - id: lint_debug
    name: "10. Lint Debug"
    shell: bash
    run: |
      set -o pipefail

      gradle \
        --no-daemon \
        --console=plain \
        --stacktrace \
        :app:lintDebug \
        2>&1 |
        tee ci-logs/lintDebug.log

      status=${PIPESTATUS[0]}

      echo "exit=$status" |
        tee -a ci-logs/lintDebug.log

      exit "$status"

  - id: compile_release
    name: "11. Compile Release Kotlin"
    shell: bash
    run: |
      set -o pipefail

      gradle \
        --no-daemon \
        --console=plain \
        --stacktrace \
        --warning-mode=all \
        :app:compileReleaseKotlin \
        2>&1 |
        tee ci-logs/compileReleaseKotlin.log

      status=${PIPESTATUS[0]}

      echo "exit=$status" |
        tee -a ci-logs/compileReleaseKotlin.log

      exit "$status"

  - id: build_debug
    name: "12. Build Debug APK"
    shell: bash
    run: |
      set -o pipefail

      gradle \
        --no-daemon \
        --console=plain \
        --stacktrace \
        :app:assembleDebug \
        2>&1 |
        tee ci-logs/assembleDebug.log

      status=${PIPESTATUS[0]}

      echo "exit=$status" |
        tee -a ci-logs/assembleDebug.log

      exit "$status"

  - id: verify_debug
    name: "13. Verify Debug APK"
    shell: bash
    run: |
      set -euo pipefail

      APK=app/build/outputs/apk/debug/app-debug.apk

      test -f "$APK"

      unzip -Z1 "$APK" |
        grep -q '^assets/brawler_icons/shelly.png$'

      unzip -Z1 "$APK" |
        grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'

      unzip -Z1 "$APK" |
        grep -q '^assets/apk_port/models/m0.bin$'

      python3 - "$APK" <<'PY'
      import sys
      import zipfile
      from pathlib import Path

      names=set(zipfile.ZipFile(sys.argv[1]).namelist())

      ids=[
          x.strip()
          for x in Path(
              'app/src/main/assets/brawler_icons_manifest.txt'
          ).read_text().splitlines()
          if x.strip()
      ]

      assert len(ids)==108

      missing=[
          f'assets/brawler_icons/{i}.png'
          for i in ids
          if f'assets/brawler_icons/{i}.png' not in names
      ]

      assert not missing, missing[:10]

      print(
          'DEBUG_APK_PASS: '
          'all 108 brawler icons present'
      )
      PY

  - id: build_release
    name: "14. Build Release APK"
    shell: bash
    run: |
      set -o pipefail

      gradle \
        --no-daemon \
        --console=plain \
        --stacktrace \
        :app:assembleRelease \
        2>&1 |
        tee ci-logs/assembleRelease.log

      status=${PIPESTATUS[0]}

      echo "exit=$status" |
        tee -a ci-logs/assembleRelease.log

      exit "$status"

  - id: verify_release
    name: "15. Verify Release APK"
    shell: bash
    run: |
      set -euo pipefail

      APK=app/build/outputs/apk/release/app-release.apk

      test -f "$APK"

      unzip -Z1 "$APK" |
        grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'

      unzip -Z1 "$APK" |
        grep -q '^assets/apk_port/brawler_icons/shelly.png$'

      unzip -Z1 "$APK" |
        grep -q '^assets/apk_port/lobby/victory.png$'

      python3 - "$APK" <<'PY'
      import sys
      import zipfile
      from pathlib import Path

      names=set(zipfile.ZipFile(sys.argv[1]).namelist())

      rows={}

      for line in Path(
          'app/src/main/assets/brawler_avatar_map.properties'
      ).read_text().splitlines():

          if line.strip() and not line.lstrip().startswith('#'):
              k,v=line.split('=',1)
              rows[k]=v

      assert len(rows)==108

      missing=[]

      for k,v in rows.items():

          if v.startswith('REMOTE|'):
              expected=f'assets/brawler_icons/{k}.png'
          else:
              expected=f'assets/apk_port/brawler_icons/{v}'

          if expected not in names:
              missing.append((k,expected))

      assert not missing, missing[:10]

      print(
          'RELEASE_APK_PASS: '
          'all 108 avatar mappings/fallbacks present'
      )
      PY

  - name: "16. Upload Debug + Release APKs"
    uses: actions/upload-artifact@v7
    with:
      name: RostikAI-v31.1.3-APKs
      if-no-files-found: error
      path: |
        app/build/outputs/apk/debug/app-debug.apk
        app/build/outputs/apk/release/app-release.apk

  - name: "17. Upload CI diagnostics"
    if: ${{ always() }}
    uses: actions/upload-artifact@v7
    with:
      name: RostikAI-v31.1.3-CI-diagnostics
      if-no-files-found: warn
      retention-days: 7
      path: |
        ci-logs/**
        app/build/reports/**
        app/build/outputs/logs/**

  - name: "18. Discord final status"
    if: ${{ always() }}
    continue-on-error: true
    shell: bash
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      JOB_STATUS: ${{ job.status }}
    run: |
      if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
        echo "DISCORD_WEBHOOK_URL is not configured; skipping."
        exit 0
      fi

      python3 - <<'PY' |
      import json
      import os

      status=os.environ.get('JOB_STATUS','unknown')

      print(json.dumps({
          'username':'RostikAI CI',
          'allowed_mentions':{'parse':[]},
          'embeds':[{
              'title':f'[BUILD] GitHub Actions {status.upper()}',
              'description':f'RostikAI v31.1.3 — {status}',
              'fields':[
                  {
                      'name':'branch',
                      'value':os.environ.get(
                          'GITHUB_REF_NAME','-'
                      ),
                      'inline':True
                  },
                  {
                      'name':'run',
                      'value':os.environ.get(
                          'GITHUB_RUN_ID','-'
                      ),
                      'inline':True
                  },
                  {
                      'name':'commit',
                      'value':os.environ.get(
                          'GITHUB_SHA','-'
                      )[:12],
                      'inline':True
                  },
              ]
          }]
      }))
      PY
      curl -fsS \
        -X POST \
        -H 'Content-Type: application/json' \
        --data-binary @- \
        "$DISCORD_WEBHOOK_URL" >/dev/null
```
