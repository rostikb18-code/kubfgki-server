name: Build Rostik Touch Bot v30.9

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate v30.9 source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "v30src/settings.gradle.kts" ]; then
            echo "Using v30src from repository root"
          elif [ -f "github_ready_v30_9/v30src/settings.gradle.kts" ]; then
            echo "Moving source from github_ready_v30_9/v30src"
            rm -rf v30src
            cp -a github_ready_v30_9/v30src ./v30src
          elif [ -f "RostikTouchBot-v30.9-FINAL-source.zip" ]; then
            echo "Extracting v30.9 source ZIP"
            rm -rf v30src
            unzip -q "RostikTouchBot-v30.9-FINAL-source.zip" -d .
          else
            echo "ERROR: v30.9 source not found"
            find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -250
            exit 1
          fi

          test -f v30src/settings.gradle.kts
          test -f v30src/build.gradle.kts
          test -f v30src/app/build.gradle.kts
          test -f v30src/app/src/main/AndroidManifest.xml
          test -f v30src/app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          test -f v30src/app/src/main/java/com/rostik/touchbot/ControlDetector.kt
          echo "Source structure OK"
          echo "Source files: $(find v30src -type f | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle project
        working-directory: v30src
        shell: bash
        run: gradle tasks --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: v30src
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        working-directory: v30src
        shell: bash
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG="v30src/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="v30src/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG"
          test -s "$RELEASE"
          ls -lh "$DEBUG" "$RELEASE"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v30.9-APKs
          if-no-files-found: error
          path: |
            v30src/app/build/outputs/apk/debug/app-debug.apk
            v30src/app/build/outputs/apk/release/app-release-unsigned.apk
