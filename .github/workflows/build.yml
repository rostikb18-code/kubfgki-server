name: RostikAI v31.1.3 - MERGED Build + Verify

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rostikai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.10.2"
  PART_PREFIX: "RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-"

jobs:
  build:
    name: "CHECK -> ASSEMBLE -> APK"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "2. Use direct source or reconstruct five parts"
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts && -f app/build.gradle.kts && -f app/src/main/AndroidManifest.xml ]]; then
            echo "DIRECT_PROJECT_PASS"
            exit 0
          fi

          rm -rf .rostik_parts .rostik_assembled
          mkdir -p .rostik_parts .rostik_assembled

          for n in 01 02 03 04 05; do
            f="${PART_PREFIX}${n}.zip"
            if [[ ! -f "$f" ]]; then
              echo "ERROR: missing $f"
              exit 1
            fi

            echo "Checking $f"
            unzip -tq "$f"
            sha256sum "$f"
            cp "$f" .rostik_parts/
          done

          # SHA256.txt is informational here. The actual ZIP integrity is
          # verified above, while the source contents are verified after assembly.
          if [[ -f SHA256.txt ]]; then
            echo "SHA256_MANIFEST_PRESENT"
            sha256sum -c SHA256.txt || echo "WARNING: SHA256.txt does not match the ZIPs currently committed; continuing with the committed ZIP contents."
          fi

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          seen = {}
          for z in sorted(Path('.rostik_parts').glob('*.zip')):
              with zipfile.ZipFile(z) as f:
                  for n in f.namelist():
                      if n.endswith('/'):
                          continue
                      if n in seen:
                          raise SystemExit(f'duplicate path: {n} in {seen[n]} and {z.name}')
                      if n.startswith('.github/'):
                          raise SystemExit(f'workflow must be supplied separately: {n}')
                      seen[n] = z.name
          print(f'ARCHIVE_INTEGRITY_PASS: {len(seen)} files')
          PY

          for n in 01 02 03 04 05; do
            unzip -q ".rostik_parts/${PART_PREFIX}${n}.zip" -d .rostik_assembled
          done

          cp -a .rostik_assembled/. ./
          echo "PART_ASSEMBLY_PASS"

      - name: "3. Source preflight + deep UI audit"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew tools/deep_audit.py
          python3 tools/verify_source.py
          python3 tools/deep_audit.py
          test "$(find app/src/main/java -name '*.kt' | wc -l)" -ge 39
          test "$(find app/src/main/assets/brawler_icons -type f | wc -l)" -eq 108
          test -f app/src/main/assets/brawler_icons_manifest.txt
          test -f app/src/main/assets/apk_port/maps/brawl_ball_maps.json
          echo "SOURCE_INVENTORY_PASS"

      - name: "4. Set up Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "5. Set up Android SDK"
        uses: android-actions/setup-android@v4

      - name: "6. Install Android SDK 35"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: "7. Set up Gradle 8.10.2"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: "8. Compile debug"
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "9. Lint debug"
        shell: bash
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "10. Assemble debug APK"
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "11. Verify debug APK"
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          echo "DEBUG_APK_PASS=$APK"

      - name: "12. Assemble release APK"
        shell: bash
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "13. Verify release APK"
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -q 'assets/apk_port/maps/brawl_ball_maps.json'
          unzip -Z1 "$APK" | grep -q 'assets/apk_port/brawler_icons/shelly.png'
          echo "RELEASE_APK_PASS=$APK"

      - name: "14. Upload APK artifacts"
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-APKs
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/**/*.apk

      - name: "15. Upload diagnostics"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-CI-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
