name: RostikAI v31.1.3 - Build + Full Verification

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_PLATFORM: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_VERSION: "8.10.2"

    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v4

      - name: "0. Assemble and verify v31.1.3 source ZIP parts"
        shell: bash
        run: |
          set -euo pipefail

          PART_DIR=".rostik_parts"
          rm -rf "$PART_DIR" .rostik_assembled
          mkdir -p "$PART_DIR" .rostik_assembled

          # Accept the two published four-part naming schemes, but never mix them.
          UPDATED_PREFIX="RostikAI-v31.1.3-PRO-QUALITY-UPDATED-PART-"
          PRO_PREFIX="RostikAI-v31.1.3-PRO-QUALITY-PART-"
          FIX_PREFIX="RostikAI-v31.1.3-COMPILE-FIX-PART-"

          declare -A UPDATED_SHA=(
            [01]="c69cc642683411c0cba8d77659e8a7037f3ec1c561022402a2f6655d5a273ea6"
            [02]="796b9ad666fde7d790fe003d86cc12006671df1ddda0dc641e8be6bfd4b23f53"
            [03]="56ef00605e95f6f93fee7b8530655ace3ac257e4beaeee41bd406069f6a41c96"
            [04]="20f1725b4c000d7ece2076b708659c4a3f6ee8148a5df1e4f888977c5d39ff11"
          )
          declare -A PRO_SHA=(
            [01]="fb70860fbfab18f62200ef517fdc45e6063149016672e53ea850f725e516d56e"
            [02]="16fb0b97ed2794e020c4f2ce2cbdd0fbec0ffcc8fb44e6af5ad9b6fb2c2da475"
            [03]="9b4cf99fdb05c26871d7cb7b96038290a11013e204c83ca7c9c5c23fab238ad6"
            [04]="55cf763ff14c8f97a632e89f4d6a43cc9c83a8faf39cad88dd72a520d42566c1"
          )
          declare -A FIX_SHA=(
            [01]="f5446b7dda0959741605183dbbd3a31379838aa8f1be2f9d97a32c09a8324a85"
            [02]="69255aef193c3f727fbc7ad1e684d7a46994e3d4e8a398d1fd364a554302ced2"
            [03]="0acd448d1f2c3c743b71324f91c55e368c0b0a424d07f9b9ce63954385d501c1"
            [04]="dd28e888817254f7a20474b7270e20340c556739ad56306fb3732711dfc75522"
          )

          updated_count=0
          pro_count=0
          fix_count=0
          for n in 01 02 03 04; do
            [[ -f "${UPDATED_PREFIX}${n}.zip" ]] && updated_count=$((updated_count+1))
            [[ -f "${PRO_PREFIX}${n}.zip" ]] && pro_count=$((pro_count+1))
            [[ -f "${FIX_PREFIX}${n}.zip" ]] && fix_count=$((fix_count+1))
          done

          families_present=0
          [[ "$updated_count" -gt 0 ]] && families_present=$((families_present+1))
          [[ "$pro_count" -gt 0 ]] && families_present=$((families_present+1))
          [[ "$fix_count" -gt 0 ]] && families_present=$((families_present+1))
          if [[ "$families_present" -gt 1 ]]; then
            echo "ERROR: mixed source ZIP families are not allowed."
            exit 1
          fi

          if [[ "$updated_count" -eq 4 || "$pro_count" -eq 4 || "$fix_count" -eq 4 ]]; then
            if [[ "$updated_count" -eq 4 ]]; then
              FAMILY="PRO-QUALITY-UPDATED"
              PREFIX="$UPDATED_PREFIX"
              declare -n EXPECTED_SHA=UPDATED_SHA
            elif [[ "$pro_count" -eq 4 ]]; then
              FAMILY="PRO-QUALITY"
              PREFIX="$PRO_PREFIX"
              declare -n EXPECTED_SHA=PRO_SHA
            else
              FAMILY="COMPILE-FIX"
              PREFIX="$FIX_PREFIX"
              declare -n EXPECTED_SHA=FIX_SHA
            fi

            echo "Using complete $FAMILY four-part source set."
            for n in 01 02 03 04; do
              zipfile="${PREFIX}${n}.zip"
              cp -f "$zipfile" "$PART_DIR/$zipfile"
              actual="$(sha256sum "$zipfile" | awk '{print $1}')"
              expected="${EXPECTED_SHA[$n]}"
              [[ "$actual" == "$expected" ]] || {
                echo "ERROR: SHA-256 mismatch for $zipfile"
                echo "expected=$expected"
                echo "actual=$actual"
                exit 1
              }
              echo "SHA-256 OK: $zipfile"
              unzip -tq "$zipfile"
            done

            # Reject duplicate file paths across parts before extraction. Silent overwrite
            # would make a split source non-deterministic.
            python3 - "$PART_DIR" <<'PY'
          import sys, zipfile
          from pathlib import Path
          root=Path(sys.argv[1])
          seen={}
          for zpath in sorted(root.glob('*.zip')):
              with zipfile.ZipFile(zpath) as z:
                  for name in z.namelist():
                      if name.endswith('/'):
                          continue
                      if name in seen:
                          raise SystemExit(f"duplicate archive path across parts: {name} ({seen[name]} and {zpath.name})")
                      seen[name]=zpath.name
          print(f"archive path uniqueness OK: {len(seen)} files")
          PY

            for n in 01 02 03 04; do
              unzip -q "${PART_DIR}/${PREFIX}${n}.zip" -d .rostik_assembled
            done

            # The ZIP parts are source packages, not GitHub workflow state. Their extracted
            # workflow is checked below; the workflow currently executing remains authoritative.
            rm -rf app gradle
            rm -f settings.gradle.kts build.gradle.kts gradle.properties gradlew gradlew.bat ROSTIK_SOURCE_ID.txt VERIFICATION_REPORT.md tools/verify_source.py
            cp -a .rostik_assembled/. ./

            test -f settings.gradle.kts
            test -f build.gradle.kts
            test -f app/build.gradle.kts
            test -f app/src/main/AndroidManifest.xml
            test -f ROSTIK_SOURCE_ID.txt
            test -f tools/verify_source.py
            test -f .github/workflows/build.yml
          elif [[ "$pro_count" -ne 0 || "$fix_count" -ne 0 ]]; then
            echo "ERROR: incomplete ZIP source set. Exactly all four parts are required."
            echo "PRO-QUALITY-UPDATED parts found: $updated_count/4"
            echo "PRO-QUALITY parts found: $pro_count/4"
            echo "COMPILE-FIX parts found: $fix_count/4"
            exit 1
          elif [[ -f ROSTIK_SOURCE_ID.txt && -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            echo "No source ZIP parts found; using repository source directly."
          else
            echo "ERROR: Android source is missing and no complete four-part source set was found."
            exit 1
          fi

          echo "Source identity:"
          cat ROSTIK_SOURCE_ID.txt
          grep -qx 'ROSTIKAI-31.1.3-COMPILE-FIX-2' ROSTIK_SOURCE_ID.txt
          echo "Source assembly/identity check passed."

      - name: "Discord - build started"
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          set -euo pipefail
          payload=$(python3 - <<'PY2'
          import json, os
          print(json.dumps({
            "username": "RostikAI CI",
            "allowed_mentions": {"parse": []},
            "embeds": [{
              "title": "[BUILD] GitHub Actions started",
              "description": "RostikAI v31.1.3 build started.",
              "color": 3447003,
              "fields": [
                {"name": "branch", "value": os.environ.get("GITHUB_REF_NAME", "-"), "inline": True},
                {"name": "commit", "value": os.environ.get("GITHUB_SHA", "-")[:12], "inline": True},
                {"name": "run", "value": os.environ.get("GITHUB_RUN_ID", "-"), "inline": True}
              ]
            }]
          }))
          PY2
          )
          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL" >/dev/null
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: "2. Set up Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "3. Locate Android SDK"
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK" || { echo "ERROR: Android SDK not found"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: "4. Install Android SDK components"
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: "5. Set up Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: "5.5. Deterministic source preflight"
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_source.py

      - name: "6. Verify Android project structure"
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rostik/touchbot/MainActivity.kt
          test -f app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          test -f app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt
          test -f app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt

      - name: "7. Verify 108 brawler catalog"
        shell: bash
        run: |
          set -euo pipefail
          grep -Ev '^[[:space:]]*$' app/src/main/assets/brawler_icons_manifest.txt | wc -l | grep -qx 108
          grep -q 'e("shelly"' app/src/main/java/com/rostik/touchbot/BrawlerCatalog.kt
          grep -q 'e("spike"' app/src/main/java/com/rostik/touchbot/BrawlerCatalog.kt

      - name: "8. Verify brawler icons + APK visual assets"
        shell: bash
        run: |
          set -euo pipefail
          test "$(find app/src/main/assets/brawler_icons -type f -name '*.png' | wc -l | tr -d ' ')" = "108"
          test -f app/src/main/assets/apk_port/brawler_icons/shelly.png
          test -f app/src/main/assets/apk_port/brawler_icons/spike.png
          test -f app/src/main/assets/apk_port/maps/brawl_ball_maps.json
          test -f app/src/main/assets/apk_port/lobby/victory.png
          test -f app/src/main/assets/apk_port/lobby/defeat.png
          test -f app/src/main/assets/apk_port/ui_objects/brawlball_gamemode_icon.png
          test -f app/src/main/assets/brawler_avatar_map.properties
          test "$(grep -Ev '^\s*(#|$)' app/src/main/assets/brawler_avatar_map.properties | wc -l | tr -d ' ')" = "108"
          python3 - <<'PY2'
          from pathlib import Path
          def valid_image(path):
              data=path.read_bytes()
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return True
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  return True
              return False
          for p in Path('app/src/main/assets/apk_port/brawler_icons').iterdir():
              if p.suffix.lower() in ('.png','.webp'):
                  assert valid_image(p), p
          print('avatar image headers valid')
          PY2
          python3 - <<'PY2'
          from pathlib import Path
          rows={}
          for line in Path('app/src/main/assets/brawler_avatar_map.properties').read_text(encoding='utf-8').splitlines():
              if line.strip() and not line.lstrip().startswith('#'):
                  k,v=line.split('=',1); rows[k]=v
          assert len(rows)==108
          local=0; remote=0
          for k,v in rows.items():
              if v.startswith('REMOTE|'):
                  remote += 1
              else:
                  local += 1
                  assert (Path('app/src/main/assets/apk_port/brawler_icons')/v).is_file(), (k,v)
          assert local==106, local
          assert remote==2, remote
          print('108 avatar mappings verified: 106 local + 2 remote cacheable')
          PY2

      - name: "9. Verify imported map catalog"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('app/src/main/assets/apk_port/maps/brawl_ball_maps.json', encoding='utf-8') as f:
              data=json.load(f)
          assert isinstance(data, dict) and len(data) >= 80, len(data)
          assert 'Back Pocket' in data
          assert all(isinstance(v, list) and len(v) == 33 for v in data.values())
          assert all(all(isinstance(row, str) and len(row) == 21 for row in rows) for rows in data.values())
          print('Brawl Ball maps:', len(data), 'valid 33x21 grids')
          PY

      - name: "10. Verify capture watchdog + gesture serialization"
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Frame watchdog recovery' app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt
          grep -q 'GestureResultCallback' app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt
          grep -q 'gestureBusy' app/src/main/java/com/rostik/touchbot/BotAccessibilityService.kt
          grep -q 'heartbeatMovement' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt

      - name: "11. Check source for known broken symbols"
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build \
            -E 'FRAME_RATE_COMPATIBILITY_NO_VIOLATION|selectAllOnFocus[[:space:]]*=' \
            app/src/main/java; then
            echo "ERROR: known broken symbols found"
            exit 1
          fi

      - name: "12. Full source preflight"
        shell: bash
        run: |
          set -euo pipefail
          test "$(find app/src/main/java -type f -name '*.kt' | wc -l | tr -d ' ')" -ge 28
          test "$(find app/src/main/assets/brawler_icons -type f -name '*.png' | wc -l | tr -d ' ')" = "108"
          test "$(find app/src/main/assets/apk_port/brawler_icons -type f | wc -l | tr -d ' ')" -ge 190
          test "$(find app/src/main/assets/apk_port/models -type f -name '*.bin' -printf '%f\n' | sort | tr '\n' ' ')" = "m0.bin m1.bin m2.bin "
          grep -q 'versionCode = 54' app/build.gradle.kts
          grep -q 'versionName = "31.1.3"' app/build.gradle.kts
          test -f ROSTIK_SOURCE_ID.txt
          grep -qx 'ROSTIKAI-31.1.3-COMPILE-FIX-2' ROSTIK_SOURCE_ID.txt
          grep -q 'buildConfig = true' app/build.gradle.kts
          grep -q 'import com.rostik.touchbot.BuildConfig' app/src/main/java/com/rostik/touchbot/DiscordLogger.kt
          ! grep -RIn --exclude-dir=build 'ball\.confidence' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          grep -q 'override fun onBind(intent: Intent?): IBinder? = null' app/src/main/java/com/rostik/touchbot/OverlayService.kt
          grep -q 'AtomicReference<Bitmap?>' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          grep -q 'class MapPlanner' app/src/main/java/com/rostik/touchbot/MapPlanner.kt
          grep -q 'QueuePersistence' app/src/main/java/com/rostik/touchbot/QueuePersistence.kt
          if grep -RIn --exclude-dir=build --exclude='*.bin' -E 'TODO|FIXME|NotImplementedException|UnsupportedOperationException' app/src/main/java; then
            echo 'ERROR: unfinished implementation marker found'
            exit 1
          fi

      - name: "13. Print Gradle + Android tool versions"
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          "$SDKMANAGER" --version

      - name: "13.5. Kotlin compile preflight"
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'override fun onBind(intent: Intent?): IBinder? = null' app/src/main/java/com/rostik/touchbot/OverlayService.kt
          ! grep -n 'ball\.confidence' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          ! grep -n 'tap=brawlers.*target\.confidence' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          grep -qx 'ROSTIKAI-31.1.3-COMPILE-FIX-2' ROSTIK_SOURCE_ID.txt
          echo "Kotlin compile preflight passed"

      - id: compile_debug
        name: "14. Compile Debug Kotlin"
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin

      - id: compile_release
        name: "16. Compile Release Kotlin"
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileReleaseKotlin

      - id: lint_debug
        name: "15. Lint Debug"
        shell: bash
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - id: build_debug
        name: "17. Build Debug APK"
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - id: verify_debug
        name: "18. Verify Debug APK"
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep -q '^assets/brawler_icons/shelly.png$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/models/m0.bin$'
          python3 - "$APK" <<'PY2'
          import sys, zipfile
          from pathlib import Path
          apk=sys.argv[1]
          names=set(zipfile.ZipFile(apk).namelist())
          ids=[x.strip() for x in Path('app/src/main/assets/brawler_icons_manifest.txt').read_text().splitlines() if x.strip()]
          assert len(ids)==108
          missing=[f'assets/brawler_icons/{i}.png' for i in ids if f'assets/brawler_icons/{i}.png' not in names]
          assert not missing, missing[:10]
          print('Debug APK contains all 108 brawler icons')
          PY2

      - id: build_release
        name: "19. Build Release APK"
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - id: verify_release
        name: "20. Verify Release APK"
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/brawler_icons/shelly.png$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/lobby/victory.png$'
          python3 - "$APK" <<'PY2'
          import sys, zipfile
          from pathlib import Path
          apk=sys.argv[1]
          names=set(zipfile.ZipFile(apk).namelist())
          rows={}
          for line in Path('app/src/main/assets/brawler_avatar_map.properties').read_text().splitlines():
              if line.strip() and not line.lstrip().startswith('#'):
                  k,v=line.split('=',1); rows[k]=v
          assert len(rows)==108
          missing=[]
          for k,v in rows.items():
              if v.startswith('REMOTE|'):
                  # Remote entries still have a visible bundled fallback.
                  expected=f'assets/brawler_icons/{k}.png'
              else:
                  expected=f'assets/apk_port/brawler_icons/{v}'
              if expected not in names: missing.append((k,expected))
          assert not missing, missing[:10]
          print('Release APK contains all 108 avatar mappings/fallbacks')
          PY2

      - name: "21. Upload Debug + Release APKs"
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-v31.1.3-APKs
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: "Discord - final build state"
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord final notification."
            exit 0
          fi
          set -euo pipefail
          payload=$(python3 - <<'PY2'
          import json, os
          status=os.environ.get("JOB_STATUS", "unknown")
          colors={"success":3066993, "failure":15158332, "cancelled":9807270}
          print(json.dumps({
            "username": "RostikAI CI",
            "allowed_mentions": {"parse": []},
            "embeds": [{
              "title": f"[BUILD] GitHub Actions {status.upper()}",
              "description": f"RostikAI v31.1.3 build finished with status: {status}",
              "color": colors.get(status, 9807270),
              "fields": [
                {"name": "branch", "value": os.environ.get("GITHUB_REF_NAME", "-"), "inline": True},
                {"name": "commit", "value": os.environ.get("GITHUB_SHA", "-")[:12], "inline": True},
                {"name": "run", "value": os.environ.get("GITHUB_RUN_ID", "-"), "inline": True},
                {"name": "compile_debug", "value": os.environ.get("STEP_COMPILE_DEBUG", "unknown"), "inline": True},
                {"name": "compile_release", "value": os.environ.get("STEP_COMPILE_RELEASE", "unknown"), "inline": True},
                {"name": "lint_debug", "value": os.environ.get("STEP_LINT_DEBUG", "unknown"), "inline": True},
                {"name": "build_debug", "value": os.environ.get("STEP_BUILD_DEBUG", "unknown"), "inline": True},
                {"name": "verify_debug", "value": os.environ.get("STEP_VERIFY_DEBUG", "unknown"), "inline": True},
                {"name": "build_release", "value": os.environ.get("STEP_BUILD_RELEASE", "unknown"), "inline": True},
                {"name": "verify_release", "value": os.environ.get("STEP_VERIFY_RELEASE", "unknown"), "inline": True}
              ]
            }]
          }))
          PY2
          )
          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL" >/dev/null
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          STEP_COMPILE_DEBUG: ${{ steps.compile_debug.outcome }}
          STEP_COMPILE_RELEASE: ${{ steps.compile_release.outcome }}
          STEP_LINT_DEBUG: ${{ steps.lint_debug.outcome }}
          STEP_BUILD_DEBUG: ${{ steps.build_debug.outcome }}
          STEP_VERIFY_DEBUG: ${{ steps.verify_debug.outcome }}
          STEP_BUILD_RELEASE: ${{ steps.build_release.outcome }}
          STEP_VERIFY_RELEASE: ${{ steps.verify_release.outcome }}
