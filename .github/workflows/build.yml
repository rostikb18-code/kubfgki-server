name: RostikAI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Assemble RostikAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip and basic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip findutils

      # IMPORTANT:
      # The repository may contain ZIP parts with ANY filenames.
      # Every ZIP in the repository is extracted into one temporary project tree.
      - name: Find and extract all ZIP project parts
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE/_rostikai_project"
          mkdir -p "$WORK"

          echo "Searching for ZIP files..."
          mapfile -d '' ZIPS < <(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname '*.zip' \
            -not -path "$WORK/*" \
            -print0 | sort -z)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No .zip files were found in the repository."
            exit 1
          fi

          echo "Found ${#ZIPS[@]} ZIP file(s):"
          for z in "${ZIPS[@]}"; do
            echo "  - $(basename "$z")"
          done

          INDEX=0
          for z in "${ZIPS[@]}"; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "=== Extracting ZIP $INDEX/${#ZIPS[@]}: $(basename "$z") ==="

            # Check archive before extraction.
            unzip -tq "$z"

            # Extract all parts into the same directory.
            # Files from different parts are expected to be complementary.
            unzip -oq "$z" -d "$WORK"
          done

          echo ""
          echo "Extraction complete."

      - name: Locate Gradle project automatically
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE/_rostikai_project"

          echo "Searching for settings.gradle / settings.gradle.kts..."

          SETTINGS=""
          while IFS= read -r -d '' f; do
            SETTINGS="$f"
            break
          done < <(
            find "$WORK" \
              -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print0 | sort -z
          )

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts or settings.gradle was found after extracting the ZIP files."
            echo "Extracted files:"
            find "$WORK" -maxdepth 4 -type f | head -200 || true
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"

          if [ ! -f "$ROOT/app/build.gradle.kts" ] && [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "::error::Gradle settings were found, but the Android app module was not found."
            echo "Detected root: $ROOT"
            find "$ROOT" -maxdepth 3 -type f | sort | head -300
            exit 1
          fi

          echo "Detected project root:"
          echo "$ROOT"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Show reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.project_root }}"

          echo "===== PROJECT ROOT ====="
          echo "$ROOT"

          echo ""
          echo "===== IMPORTANT FILES ====="
          find "$ROOT" -maxdepth 3 -type f \
            \( -name 'settings.gradle*' \
            -o -name 'build.gradle*' \
            -o -name 'gradlew' \
            -o -name 'gradle.properties' \
            -o -name 'AndroidManifest.xml' \) \
            -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # If the ZIP project contains gradlew, use it.
      # If it does not, install Gradle automatically and use that instead.
      - name: Detect Gradle launcher
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate.outputs.project_root }}"

          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
            echo "launcher=$ROOT/gradlew" >> "$GITHUB_OUTPUT"
            echo "Using Gradle Wrapper."
          else
            echo "No gradlew found. Gradle will be installed automatically."
            echo "launcher=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle when wrapper is missing
        if: steps.gradle.outputs.launcher == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify reconstructed Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate.outputs.project_root }}"
          LAUNCHER="${{ steps.gradle.outputs.launcher }}"

          cd "$ROOT"

          echo "Gradle root: $(pwd)"
          echo "Launcher: $LAUNCHER"

          "$LAUNCHER" --version

          echo ""
          echo "Checking Android module..."
          test -f app/build.gradle.kts || test -f app/build.gradle

          echo ""
          echo "Checking source tree..."
          test -d app/src/main

          echo ""
          echo "Checking MainActivity..."
          if ! find app/src/main -type f -name 'MainActivity.kt' -print -quit | grep -q .; then
            echo "::warning::MainActivity.kt was not found by filename. Continuing because another Android entry point may be used."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate.outputs.project_root }}"
          LAUNCHER="${{ steps.gradle.outputs.launcher }}"

          cd "$ROOT"
          "$LAUNCHER" --no-daemon --stacktrace assembleDebug

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate.outputs.project_root }}"
          LAUNCHER="${{ steps.gradle.outputs.launcher }}"

          cd "$ROOT"
          "$LAUNCHER" --no-daemon --stacktrace assembleRelease

      - name: Find generated APKs
        id: apks
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.locate.outputs.project_root }}"

          echo "===== GENERATED APK FILES ====="
          find "$ROOT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -exec ls -lh {} \;

          DEBUG="$(find "$ROOT/app/build/outputs/apk" \
            -type f -path '*/debug/*.apk' -print -quit)"

          RELEASE="$(find "$ROOT/app/build/outputs/apk" \
            -type f -path '*/release/*.apk' -print -quit)"

          if [ -z "$DEBUG" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "debug=$DEBUG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-debug-APK
          path: ${{ steps.apks.outputs.debug }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RostikAI-release-APK
          path: ${{ steps.apks.outputs.release }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "## RostikAI APK build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ZIP parts were extracted automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "Gradle project was detected automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "Debug and Release APK artifacts were uploaded." >> "$GITHUB_STEP_SUMMARY"
