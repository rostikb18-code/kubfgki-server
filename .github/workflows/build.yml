name: RostikAI v31.1.3 - Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.10.2"
  PART_PREFIX: "RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7

      # ============================================================
      # 2. ASSEMBLE PROJECT FROM 5 ZIP PARTS
      # ============================================================

      - name: Assemble Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .rostik_parts .rostik_assembled
          mkdir -p .rostik_parts .rostik_assembled

          for n in 01 02 03 04 05; do
            FILE="${PART_PREFIX}${n}.zip"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: missing $FILE"
              exit 1
            fi

            unzip -tq "$FILE"
            cp -f "$FILE" ".rostik_parts/$FILE"

            echo "PART $n OK"
          done

          for n in 01 02 03 04 05; do
            unzip -q \
              ".rostik_parts/${PART_PREFIX}${n}.zip" \
              -d .rostik_assembled
          done

          test -f .rostik_assembled/settings.gradle.kts
          test -f .rostik_assembled/build.gradle.kts
          test -f .rostik_assembled/app/build.gradle.kts

          rm -rf app gradle

          rm -f \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            gradlew \
            gradlew.bat

          cp -a .rostik_assembled/. ./

          chmod +x gradlew

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "PROJECT ASSEMBLY OK"

      # ============================================================
      # 3. FIX KNOWN KOTLIN COMPILER ERROR
      # ============================================================

      - name: Fix duplicate activeReader
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          lines = path.read_text(
              encoding="utf-8"
          ).splitlines(keepends=True)

          pattern = re.compile(
              r'^\s*val\s+activeReader\s*(?::[^=]+)?='
          )

          positions = [
              i
              for i, line in enumerate(lines)
              if pattern.search(line)
          ]

          print(
              "activeReader declarations:",
              len(positions)
          )

          if len(positions) > 1:
              # Удаляем только второе объявление.
              del lines[positions[1]]

              path.write_text(
                  "".join(lines),
                  encoding="utf-8"
              )

              print(
                  "Removed duplicate activeReader declaration."
              )

          final_lines = path.read_text(
              encoding="utf-8"
          ).splitlines()

          final_count = sum(
              1
              for line in final_lines
              if pattern.search(line)
          )

          if final_count != 1:
              raise SystemExit(
                  "ERROR: activeReader must have exactly "
                  f"one declaration, found {final_count}"
              )

          print("activeReader FIX OK")
          PY

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      # ============================================================
      # 6. GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 7. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            :app:assembleDebug \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=============================="
            echo "DEBUG BUILD FAILED"
            echo "=============================="
            echo ""
            tail -n 200 build.log
            exit "$STATUS"
          fi

          echo "DEBUG BUILD SUCCESS"

      # ============================================================
      # 8. VERIFY APK EXISTS
      # ============================================================

      - name: Check Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -tq "$APK"

          echo "APK CREATED:"
          ls -lh "$APK"

      # ============================================================
      # 9. UPLOAD DEBUG APK
      # ============================================================

      - name: Upload Debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-Debug-APK
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/debug/app-debug.apk

      # ============================================================
      # 10. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            :app:assembleRelease \
            2>&1 | tee release.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=============================="
            echo "RELEASE BUILD FAILED"
            echo "=============================="
            echo ""
            tail -n 200 release.log
            exit "$STATUS"
          fi

          echo "RELEASE BUILD SUCCESS"

      # ============================================================
      # 11. UPLOAD RELEASE APK
      # ============================================================

      - name: Upload Release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-Release-APK
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/release/app-release.apk

      # ============================================================
      # 12. LOGS ONLY IF SOMETHING FAILED
      # ============================================================

      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-Build-Logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            build.log
            release.log
            app/build/reports/**
            app/build/outputs/logs/**
```
