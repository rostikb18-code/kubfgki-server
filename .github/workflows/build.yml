name: Build Rostik Touch Bot v30.11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rostik-touch-bot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          test -d app/src/main/assets
          test -d .github/workflows
          echo "Project root OK"
          echo "Kotlin source files: $(find app/src/main/java -type f -name '*.kt' | wc -l)"
          echo "Asset files: $(find app/src/main/assets -type f | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | sed -n '1,80p'

      - name: Gradle configuration check
        run: gradle tasks --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v30.11-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
