name: RostikAI v31.1.3 - Fast Verified APK Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rostikai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.10.2"
  PART_PREFIX: "RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-"

jobs:
  build:
    name: "CHECK -> FIX -> BUILD APK"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "2. Verify and reconstruct five project parts"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .rostik_parts .rostik_assembled
          mkdir -p .rostik_parts .rostik_assembled

          echo "=== CHECKING FIVE SOURCE PARTS ==="

          for n in 01 02 03 04 05; do
            f="${PART_PREFIX}${n}.zip"

            test -f "$f" || {
              echo "ERROR: missing source part: $f"
              exit 1
            }

            size_bytes="$(stat -c '%s' "$f")"
            size_mb=$(( (size_bytes + 1048575) / 1048576 ))

            echo "[$n/05] $f"
            echo "size=${size_mb} MiB"

            if [[ "$size_bytes" -gt 26214400 ]]; then
              echo "ERROR: $f is larger than 25 MiB"
              exit 1
            fi

            echo "sha256=$(sha256sum "$f" | awk '{print $1}')"
            unzip -tq "$f"
            cp -f "$f" ".rostik_parts/$f"
            echo "PART_${n}_PASS"
          done

          echo "=== CHECKING ARCHIVE PATH UNIQUENESS ==="

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          seen = {}
          total = 0

          for archive in sorted(Path('.rostik_parts').glob('*.zip')):
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if name.endswith('/'):
                          continue
                      if name.startswith('.github/'):
                          raise SystemExit(
                              f'ERROR: workflow must remain outside source parts: {name}'
                          )
                      if name in seen:
                          raise SystemExit(
                              f'ERROR: duplicate archive path: {name} '
                              f'({seen[name]} and {archive.name})'
                          )
                      seen[name] = archive.name
                      total += 1

          print(f'ARCHIVE_INTEGRITY_PASS: {total} unique files')
          PY

          echo "=== EXTRACTING ALL FIVE PARTS ==="
          for n in 01 02 03 04 05; do
            unzip -q ".rostik_parts/${PART_PREFIX}${n}.zip" -d .rostik_assembled
          done

          test -f .rostik_assembled/settings.gradle.kts
          test -f .rostik_assembled/build.gradle.kts
          test -f .rostik_assembled/app/build.gradle.kts
          test -f .rostik_assembled/gradlew
          test -f .rostik_assembled/ROSTIK_SOURCE_ID.txt
          test -f .rostik_assembled/SOURCE_FILE_SHA256.txt
          test -f .rostik_assembled/tools/verify_source.py

          cp -a .rostik_assembled/. ./
          chmod +x gradlew

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "PART_ASSEMBLY_PASS"
          echo "PROJECT_ROOT_PASS"

      # IMPORTANT: source verification MUST happen before any source repair.
      # verify_source.py intentionally hashes ScreenCaptureService.kt.
      - name: "3. Verify original source and assets"
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew tools/*.py

          python3 tools/verify_source.py
          python3 tools/deep_audit.py
          python3 tools/full_audit.py
          python3 tools/ci_source_audit.py

          test "$(find app/src/main/java -name '*.kt' | wc -l)" -ge 39
          test "$(find app/src/main/assets/brawler_icons -type f | wc -l)" -eq 108
          test -f app/src/main/assets/brawler_icons_manifest.txt
          test -f app/src/main/assets/apk_port/maps/brawl_ball_maps.json
          test -f app/src/main/assets/apk_port/models/m0.bin
          test -f app/src/main/assets/apk_port/models/m1.bin
          test -f app/src/main/assets/apk_port/models/m2.bin

          echo "SOURCE_VERIFICATION_PASS"

      - name: "4. Repair only the known duplicate activeReader compile error"
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt"
          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          # Handles both forms reported by Kotlin:
          #   val activeReader = ...
          #   val activeReader: ImageReader = ...
          declaration = re.compile(
              r'^\s*val\s+activeReader\s*(?::[^=]+)?='
          )

          matches = [i for i, line in enumerate(lines) if declaration.search(line)]

          if len(matches) == 1:
              print("SOURCE_REPAIR_PASS: activeReader already has one declaration")
          elif len(matches) == 2:
              duplicate = matches[1]
              del lines[duplicate]
              path.write_text("".join(lines), encoding="utf-8")
              print(
                  "SOURCE_REPAIR_PASS: removed second activeReader declaration "
                  f"at original line {duplicate + 1}"
              )
          else:
              raise SystemExit(
                  "ERROR: unexpected activeReader declaration count: "
                  f"{len(matches)}; refusing to modify source"
              )

          final = path.read_text(encoding="utf-8")
          final_count = sum(1 for line in final.splitlines() if declaration.search(line))
          if final_count != 1:
              raise SystemExit(
                  f"ERROR: activeReader declarations after repair = {final_count}, expected 1"
              )
          PY

      - name: "5. Runtime safety checks"
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="mediaProjection"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'canPerformGestures' app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'registerForActivityResult' app/src/main/java/com/rostik/touchbot/MainActivity.kt
          grep -q 'acquireLatestImage' app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt
          grep -q 'setSelectAllOnFocus(false)' app/src/main/java/com/rostik/touchbot/OverlayService.kt
          grep -q 'this.text = text' app/src/main/java/com/rostik/touchbot/OverlayService.kt
          grep -q 'ENEMY_ATTACK_DISTANCE' app/src/main/java/com/rostik/touchbot/ReactiveBrawlBallController.kt
          grep -q 'service.dispatch(frame, left ?: TouchLayout.MOVE, right' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt

          echo "RUNTIME_SAFETY_PASS"

      - name: "6. Set up Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "7. Set up Android SDK"
        uses: android-actions/setup-android@v4

      - name: "8. Install Android SDK 35"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: "9. Set up Gradle 8.10.2"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: "10. Gradle project preflight"
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -x gradlew
          command -v gradle
          ./gradlew --version
          ./gradlew projects \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain
          echo "GRADLE_PROJECT_PREFLIGHT_PASS"

      - name: "11. Compile debug Kotlin"
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all \
            --console=plain \
            2>&1 | tee compileDebugKotlin.log

          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::error::Debug Kotlin compilation failed. Primary diagnostics:"
            grep -E '(^e: |^.*\.kt:[0-9]+:[0-9]+:|What went wrong:|Caused by:|FAILURE:)' \
              compileDebugKotlin.log | tail -n 120 || true
          fi

          exit "$status"

      - name: "12. Lint debug"
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all \
            --console=plain

      - name: "13. Assemble debug APK"
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all \
            --console=plain

      - name: "14. Verify debug APK"
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"

          unzip -Z1 "$APK" | grep -q '^assets/brawler_icons/shelly.png$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/models/m0.bin$'

          echo "DEBUG_APK_PASS=$APK"

      # Debug APK is uploaded immediately, so a later release-only problem
      # cannot prevent the user from receiving the working debug artifact.
      - name: "15. Upload debug APK immediately"
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-Debug-APK
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: "16. Assemble release APK"
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all \
            --console=plain

      - name: "17. Verify release APK"
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"

          unzip -Z1 "$APK" | grep -q '^assets/apk_port/maps/brawl_ball_maps.json$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/models/m0.bin$'
          unzip -Z1 "$APK" | grep -q '^assets/apk_port/brawler_icons/shelly.png$'

          echo "RELEASE_APK_PASS=$APK"

      - name: "18. Upload release APK"
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-Release-APK
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/release/app-release.apk

      - name: "19. Upload diagnostics"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-CI-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            compileDebugKotlin.log
            app/build/reports/**
            app/build/outputs/logs/**
