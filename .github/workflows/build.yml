name: Build Rostik Touch Bot v30.9.2 Stable

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_PLATFORM: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GRADLE_VERSION: "8.10.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK" || { echo "ERROR: Android SDK not found on runner"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/rostik-project"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          find_project() {
            local search_root="$1"
            while IFS= read -r settings; do
              local dir
              dir="$(dirname "$settings")"
              if [[ -f "$dir/app/build.gradle.kts" || -f "$dir/app/build.gradle" ]] && [[ -f "$dir/app/src/main/AndroidManifest.xml" ]]; then
                printf '%s\n' "$dir"
                return 0
              fi
            done < <(find "$search_root" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -print)
            return 1
          }

          PROJECT=""
          PROJECT="$(find_project "$ROOT" || true)"

          if [[ -z "$PROJECT" ]]; then
            mapfile -t ZIPS < <(find "$ROOT" -maxdepth 2 -type f -iname '*.zip' -not -path '*/.git/*' -print | sort)
            for zip in "${ZIPS[@]}"; do
              rm -rf "$EXTRACT_ROOT/current"
              mkdir -p "$EXTRACT_ROOT/current"
              if ! unzip -q "$zip" -d "$EXTRACT_ROOT/current"; then
                continue
              fi
              CANDIDATE="$(find_project "$EXTRACT_ROOT/current" || true)"
              if [[ -n "$CANDIDATE" ]]; then
                PROJECT="$CANDIDATE"
                echo "Extracted Android project from: $zip"
                break
              fi
            done
          fi

          [[ -n "$PROJECT" ]] || {
            echo "ERROR: No Android Gradle project found and no ZIP contained one."
            echo "Expected settings.gradle(.kts), app/build.gradle(.kts), and app/src/main/AndroidManifest.xml."
            exit 1
          }

          echo "PROJECT_ROOT=$PROJECT" >> "$GITHUB_ENV"
          echo "Selected project root: $PROJECT"
          test -f "$PROJECT/settings.gradle.kts" || test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle.kts" || test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

      - name: Verify 108 brawlers and icons
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PROJECT_ROOT"
          MANIFEST="$ROOT/app/src/main/assets/brawler_icons_manifest.txt"
          ICON_DIR="$ROOT/app/src/main/assets/brawler_icons"
          test -f "$MANIFEST" || { echo "Missing $MANIFEST"; exit 1; }
          test -d "$ICON_DIR" || { echo "Missing $ICON_DIR"; exit 1; }
          manifest_count=$(grep -Ev '^[[:space:]]*$' "$MANIFEST" | wc -l | tr -d ' ')
          icon_count=$(find "$ICON_DIR" -type f -name '*.png' | wc -l | tr -d ' ')
          [[ "$manifest_count" == "108" ]] || { echo "manifest=$manifest_count, expected 108"; exit 1; }
          [[ "$icon_count" == "108" ]] || { echo "icons=$icon_count, expected 108"; exit 1; }
          while IFS= read -r id; do
            [[ -f "$ICON_DIR/$id.png" ]] || { echo "Missing icon: $id.png"; exit 1; }
          done < <(grep -Ev '^[[:space:]]*$' "$MANIFEST")

      - name: Check source for known broken symbols
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=.gradle --exclude-dir=build \
            -E 'FRAME_RATE_COMPATIBILITY_NO_VIOLATION|selectAllOnFocus[[:space:]]*=' \
            "$PROJECT_ROOT/app/src/main/java"

      - name: Build debug and release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_ROOT" :app:assembleDebug :app:assembleRelease

      - name: Verify APK contains all 108 icons
        shell: bash
        run: |
          set -euo pipefail
          for apk in \
            "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" \
            "$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk"; do
            test -f "$apk"
            count=$(unzip -Z1 "$apk" | grep -E '^assets/brawler_icons/[^/]+\.png$' | wc -l | tr -d ' ')
            [[ "$count" == "108" ]] || { echo "$apk contains $count icons"; exit 1; }
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RostikTouchBot-v30.9.2-APKs
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/app-release.apk
