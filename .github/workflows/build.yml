name: RostikAI Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android-native/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Validate native project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-native/settings.gradle.kts
          test -f android-native/build.gradle.kts
          test -f android-native/gradle.properties
          test -f android-native/app/build.gradle.kts
          test -f android-native/app/src/main/AndroidManifest.xml
          test -f android-native/app/src/main/java/com/rostik/ai/MainActivity.kt
          test -f android-native/app/src/main/java/com/rostik/ai/OverlayService.kt
          grep -q 'android:name=".OverlayService"' android-native/app/src/main/AndroidManifest.xml
          grep -q 'ACTION_START' android-native/app/src/main/java/com/rostik/ai/OverlayService.kt
          grep -q 'applicationId = "com.rostik.ai"' android-native/app/build.gradle.kts
          grep -q 'class MainActivity' android-native/app/src/main/java/com/rostik/ai/MainActivity.kt
          grep -q 'onnxruntime-android' android-native/app/build.gradle.kts
          echo "Native project preflight passed."

      - name: Bundle offline brawler catalog and portraits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request, time
          root = pathlib.Path("android-native/app/src/main/assets")
          icons = root / "brawler_icons"
          icons.mkdir(parents=True, exist_ok=True)
          request = urllib.request.Request(
              "https://api.brawlapi.com/v1/brawlers",
              headers={"User-Agent": "RostikAI-Android-Build/1.0", "Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          entries = payload.get("list", [])
          if not entries:
              raise SystemExit("BrawlAPI returned no brawlers; refusing to create an empty offline catalog")
          catalog = []
          failed = []
          for item in entries:
              try:
                  bid = int(item["id"])
                  name = str(item["name"]).strip()
                  urls = list(dict.fromkeys(u for u in (item.get("imageUrl2"), item.get("imageUrl")) if u))
                  if not name or not urls:
                      raise ValueError("missing name/image URL")
                  image_data = None
                  image_errors = []
                  for url in urls:
                      try:
                          req = urllib.request.Request(url, headers={"User-Agent": "RostikAI-Android-Build/1.0"})
                          with urllib.request.urlopen(req, timeout=20) as response:
                              candidate = response.read()
                          if len(candidate) < 100:
                              raise ValueError("image response too small")
                          image_data = candidate
                          break
                      except Exception as exc:
                          image_errors.append(str(exc))
                  if image_data is None:
                      raise ValueError("all portrait URLs failed: " + "; ".join(image_errors))
                  (icons / (str(bid) + ".png")).write_bytes(image_data)
                  catalog.append({"id": bid, "name": name})
              except Exception as exc:
                  failed.append(str(item.get("name", item.get("id", "?"))) + ": " + str(exc))
          if len(catalog) < max(1, int(len(entries) * 0.9)):
              raise SystemExit(f"Too many portraits failed: {len(catalog)}/{len(entries)}; first errors: {failed[:5]}")
          (root / "brawler_catalog.json").write_text(
              json.dumps({"list": catalog}, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"Bundled offline roster: {len(catalog)}/{len(entries)}")
          print(f"Bundled portrait files: {len(list(icons.glob('*.png')))}")
          if failed:
              print("Portrait download warnings: " + "; ".join(failed[:10]))
          PY

      - name: Download, export and validate the trained scene detector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ultralytics onnx onnxruntime
          mkdir -p android-native/app/src/main/assets/models
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/datasets/BlackPymer2/BrawlStars-gameplay/resolve/main/best.pt" \
            --output /tmp/rostikai-best.pt
          test -s /tmp/rostikai-best.pt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          import numpy as np
          import onnx
          import onnxruntime as ort
          from ultralytics import YOLO
          source = Path('/tmp/rostikai-best.pt')
          target = Path('android-native/app/src/main/assets/models/scene_detector.onnx')
          model = YOLO(str(source))
          model.export(format='onnx', imgsz=640, opset=17, simplify=False, dynamic=False)
          exported = source.with_suffix('.onnx')
          if not exported.is_file() or exported.stat().st_size < 1_000_000:
              raise SystemExit('Detector ONNX export missing or implausibly small')
          graph = onnx.load(str(exported), load_external_data=True)
          onnx.checker.check_model(graph)
          session = ort.InferenceSession(str(exported), providers=['CPUExecutionProvider'])
          inputs = session.get_inputs()
          outputs = session.get_outputs()
          if len(inputs) != 1 or inputs[0].shape != [1, 3, 640, 640]:
              raise SystemExit(f'Unexpected input contract: {[(i.name, i.shape, i.type) for i in inputs]}')
          # Execute one synthetic tensor to verify the exported graph runs end-to-end.
          result = session.run(None, {inputs[0].name: np.zeros((1, 3, 640, 640), dtype=np.float32)})
          if not result or not np.isfinite(result[0]).all():
              raise SystemExit('ONNX smoke inference failed or produced non-finite values')
          import shutil
          shutil.copy2(exported, target)
          labels = {str(k): str(v) for k, v in model.names.items()}
          report = {
            'source_checkpoint': 'BlackPymer2/BrawlStars-gameplay/best.pt',
            'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
            'onnx_sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
            'onnx_bytes': target.stat().st_size,
            'input': {'name': inputs[0].name, 'shape': inputs[0].shape, 'type': inputs[0].type},
            'outputs': [{'name': o.name, 'shape': o.shape, 'type': o.type} for o in outputs],
            'labels': labels,
            'synthetic_cpu_inference': 'passed',
            'gameplay_accuracy': 'NOT EVALUATED; observe-only; do not execute actions from this model yet'
          }
          Path('android-native/app/src/main/assets/models/scene_detector.model-card.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
          sha256sum android-native/app/src/main/assets/models/scene_detector.onnx
          test -s android-native/app/src/main/assets/models/scene_detector.model-card.json

      - name: Audit AI asset readiness (non-blocking, honest report)
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="android-native/app/src/main/assets/brawler_icons"
          MODEL_DIR="android-native/app/src/main/assets/models"
          if [ -d "$ICON_DIR" ]; then
            ICON_COUNT=$(find "$ICON_DIR" -type f \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' \) | wc -l)
          else
            ICON_COUNT=0
          fi
          if [ -d "$MODEL_DIR" ]; then
            MODEL_COUNT=$(find "$MODEL_DIR" -type f -iname '*.onnx' | wc -l)
          else
            MODEL_COUNT=0
          fi
          echo "Brawler icon files found: $ICON_COUNT (target: 108)"
          echo "ONNX files found: $MODEL_COUNT (target: 5)"
          CATALOG="android-native/app/src/main/assets/brawler_catalog.json"
          CATALOG_COUNT=0
          if [ -s "$CATALOG" ]; then
            CATALOG_COUNT=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8")).get("list", [])))' "$CATALOG")
          fi
          echo "Catalog entries: $CATALOG_COUNT; portrait files: $ICON_COUNT; desired roster target: 108"
          if [ "$ICON_COUNT" -ne "$CATALOG_COUNT" ]; then
            echo "::warning::Portrait count ($ICON_COUNT) differs from catalog entries ($CATALOG_COUNT)."
          fi
          if [ "$CATALOG_COUNT" -lt 108 ]; then
            echo "::warning::The upstream BrawlAPI catalog currently supplied only $CATALOG_COUNT entries; no placeholder brawler/icon will be fabricated."
          fi
          if [ "$MODEL_COUNT" -ne 5 ]; then
            echo "::warning::Expected 5 real ONNX model files; found $MODEL_COUNT. No dummy model files are generated; detector training and validation are still required."
          fi
          if [ "$MODEL_COUNT" -eq 5 ]; then
            for model in "$MODEL_DIR"/*.onnx; do
              test -s "$model" || { echo "::error::Empty ONNX file: $model"; exit 1; }
              file "$model"
            done
          fi
          echo "Asset counts alone do not verify model validity, provenance, tensor compatibility, or inference quality."

      - name: Run tactical policy unit tests
        working-directory: android-native
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace --console=plain testDebugUnitTest 2>&1 | tee test.log

      - name: Build debug APK
        working-directory: android-native
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache --stacktrace --console=plain assembleDebug 2>&1 | tee build.log

      - name: Verify APK package and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.rostik.ai'"
          echo "APK package id verified: com.rostik.ai"
          echo "APK CREATED:"
          ls -lh "$APK"
          sha256sum "$APK" | tee android-native/app/build/outputs/apk/debug/SHA256.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: RostikAI-native-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: RostikAI-build-logs
          path: |
            android-native/build.log
            android-native/app/build/reports/**
            android-native/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
