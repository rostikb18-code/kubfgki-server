name: RostikAI v31.1.3 - Android Build + Full Verify

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rostikai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.10.2"
  PART_PREFIX: "RostikAI-v31.1.3-MERGED-ANDROID-PROJECT-PART-"

jobs:
  build:
    name: "CHECK -> ASSEMBLE -> APK"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "2. Verify and reconstruct five project parts"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rostik_parts .rostik_assembled
          mkdir -p .rostik_parts .rostik_assembled
          declare -A SHA=(
            [01]="09eb0e739b8af82344107d2b0d6ce728ebcb02536e4a70cb9759624dcc0adeb4"
            [02]="4e61bfad9540b2c0a7d7a4c40b3867bc6f416f5eb3b248e1e75681271eb99e3f"
            [03]="320d4e9612d9b6507d4b9b444eadbc18b0294a12b45228982ee137df023aaae9"
            [04]="f5580328af74920214498ad74d0c100566f74e36455a07b3067b8591097439ea"
            [05]="045b6d0378230cebda622d0c3bdb924add751b8d8dacd02e226b7d74824af147"
          )
          for n in 01 02 03 04 05; do
            f="${PART_PREFIX}${n}.zip"
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
            actual="$(sha256sum "$f" | awk '{print $1}')"
            test "$actual" = "${SHA[$n]}" || { echo "ERROR: SHA mismatch $f"; exit 1; }
            unzip -tq "$f"
            cp "$f" .rostik_parts/
          done
          python3 - <<'PY2'
          from pathlib import Path
          import zipfile
          seen={}
          for z in sorted(Path('.rostik_parts').glob('*.zip')):
              with zipfile.ZipFile(z) as f:
                  for n in f.namelist():
                      if n.endswith('/'): continue
                      if n in seen: raise SystemExit(f'duplicate path: {n} in {seen[n]} and {z.name}')
                      if n.startswith('.github/'): raise SystemExit(f'workflow must be supplied separately: {n}')
                      seen[n]=z.name
          print(f'ARCHIVE_INTEGRITY_PASS: {len(seen)} files')
          PY2
          for n in 01 02 03 04 05; do
            unzip -q ".rostik_parts/${PART_PREFIX}${n}.zip" -d .rostik_assembled
          done
          cp -a .rostik_assembled/. ./
          echo "PART_ASSEMBLY_PASS"

      - name: "3. Source preflight + deep audit"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew tools/deep_audit.py
          python3 tools/verify_source.py
          python3 tools/deep_audit.py
          python3 tools/full_audit.py
          python3 tools/ci_source_audit.py
          test "$(find app/src/main/java -name '*.kt' | wc -l)" -ge 39
          test "$(find app/src/main/assets/brawler_icons -type f | wc -l)" -eq 108
          test -f app/src/main/assets/brawler_icons_manifest.txt
          test -f app/src/main/assets/apk_port/maps/brawl_ball_maps.json
          test -f app/src/main/assets/apk_port/models/m0.bin
          test -f app/src/main/assets/apk_port/models/m1.bin
          test -f app/src/main/assets/apk_port/models/m2.bin
          echo "SOURCE_INVENTORY_PASS"

      - name: "4. Runtime safety audit"
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="mediaProjection"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'canPerformGestures' app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'registerForActivityResult' app/src/main/java/com/rostik/touchbot/MainActivity.kt
          grep -q 'acquireLatestImage' app/src/main/java/com/rostik/touchbot/ScreenCaptureService.kt
          grep -q 'setSelectAllOnFocus(false)' app/src/main/java/com/rostik/touchbot/OverlayService.kt
          grep -q 'this.text = text' app/src/main/java/com/rostik/touchbot/OverlayService.kt
          grep -q 'ENEMY_ATTACK_DISTANCE' app/src/main/java/com/rostik/touchbot/ReactiveBrawlBallController.kt
          grep -q 'service.dispatch(frame, left ?: TouchLayout.MOVE, right' app/src/main/java/com/rostik/touchbot/MatchSupervisor.kt
          echo "RUNTIME_SAFETY_AUDIT_PASS"

      - name: "5. Set up Java 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "6. Set up Android SDK"
        uses: android-actions/setup-android@v4

      - name: "7. Install Android SDK 35"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: "8. Set up Gradle 8.10.2"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: "9. Compile debug"
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "10. Lint debug"
        shell: bash
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "11. Assemble debug APK"
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "12. Verify debug APK"
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          echo "DEBUG_APK_PASS=$APK"

      - name: "13. Assemble release APK"
        shell: bash
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode=all --console=plain

      - name: "14. Verify release APK"
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -q 'assets/apk_port/maps/brawl_ball_maps.json'
          unzip -Z1 "$APK" | grep -q 'assets/apk_port/models/m0.bin'
          unzip -Z1 "$APK" | grep -q 'assets/apk_port/brawler_icons/shelly.png'
          echo "RELEASE_APK_PASS=$APK"

      - name: "15. Upload APK artifacts"
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-APKs
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/**/*.apk

      - name: "16. Upload diagnostics"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: RostikAI-v31.1.3-CI-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
